<script>
"use strict";
/* ============ P2 · CONFIRMADO (v2: página única) ============ */
SCREENS.conf_tipo = { crumb:"Confirmado", html: () => `
  <p class="kick">TEV confirmado</p>
  <h2>O que está confirmado?</h2>
  <div class="opts">
    <button class="opt" onclick="ST.data.via='tep';ST.data.ctpa='pos';go('tep_pos','TEP')"><b>🫁 TEP</b><small>Estratificar (ESC + AHA) &gt; internar ou dar alta &gt; iniciar anticoagulação</small></button>
    <button class="opt" onclick="ST.data.via='tvp';ST.data.tvpConf=true;go('tvp_eco','TVP')"><b>🦵 TVP</b><small>Classificar (proximal / distal / TVS) &gt; tratar &gt; referenciar</small></button>
  </div>
`};
function radioRow(id, opts, sel){
  return '<div class="radio3" id="'+id+'">'+opts.map((o,i)=>
    '<label data-v="'+o[0]+'"'+(sel===o[0]?' class="on"':'')+' onclick="rSel(this,\''+id+'\')"><input type="radio">'+o[1]+'</label>').join('')+'</div>';
}
function rSel(l,g){ document.querySelectorAll("#"+g+" label").forEach(x=>x.classList.remove("on")); l.classList.add("on"); stratCalc(); }
function rv(g){ const l=document.querySelector("#"+g+" label.on"); return l? l.dataset.v : null; }
const SPESI = ["Idade > 80 anos","Neoplasia","Doença cardiopulmonar crónica","FC ≥ 110 bpm","TAS < 100 mmHg","SpO₂ < 90%"];
SCREENS.conf_strat = { crumb:"Estratificação", html: () => `
  <p class="kick">TEP confirmado</p>
  <h2>Estratificação (ESC 2019)</h2>
  <p style="font-size:14.5px;font-weight:700;margin:14px 0 4px">1 · Instabilidade hemodinâmica</p>
  ${radioRow("q_inst",[["nao","Não"],["sim","Sim"]], ST.data.instavel==='nao'?'nao':null)}
  ${info("Definição de instabilidade (ESC, Tabela 4): basta um critério",`
    <table class="itb"><tr><th>Forma</th><th>Critérios</th></tr>
      <tr><td>Paragem cardiorrespiratória</td><td>Necessidade de reanimação</td></tr>
      <tr><td>Choque obstrutivo</td><td>TAS &lt;90 mmHg <b>ou</b> vasopressores, <b>com</b> hipoperfusão de órgão</td></tr>
      <tr><td>Hipotensão persistente</td><td>TAS &lt;90 mmHg <b>ou</b> queda ≥40 mmHg, &gt;15 min, sem outra causa</td></tr>
    </table>`,"")}
  <p style="font-size:14.5px;font-weight:700;margin:14px 0 4px">2 · sPESI <span class="mini">(1 ponto por item)</span></p>
  ${SPESI.map((s,i)=>chk("sp"+i,s)).join("")}
  <p style="font-size:14.5px;font-weight:700;margin:14px 0 4px">3 · Disfunção do ventrículo direito</p>
  ${radioRow("q_vd",[["sim","Sim"],["nao","Não"],["nd","Não avaliado"]],null)}
  ${info("Critérios de disfunção do VD: basta um critério",`
    <table class="itb"><tr><th>Onde</th><th>Critérios</th></tr>
      <tr><td>Angio-TC diagnóstica</td><td>Rácio VD/VE ≥1,0 (corte de 4 câmaras)</td></tr>
      <tr><td>Ecocardiograma</td><td>VD/VE ≥1,0, TAPSE &lt;16 mm, hipocinésia da parede livre, sinal de McConnell, sinal 60/60, ou septo em D (achatamento septal)</td></tr>
      <tr><td>Relatório</td><td>“Disfunção do VD” reportada pelo ecocardiografista</td></tr>
    </table>`,"ESC 2019, Figura 3")}
  <div class="warnband" id="w_vd" style="display:none">⚠ Sem VD avaliado não se pode classificar como baixo risco. <b>A angio-TC que fez o diagnóstico quase sempre permite medir o rácio VD/VE</b>: pedir ao radiologista ou medir no corte de 4 câmaras. Se de todo impossível: internar como intermédio no mínimo e completar.</div>
  <p style="font-size:14.5px;font-weight:700;margin:14px 0 4px">4 · Troponina</p>
  ${radioRow("q_tp",[["pos","Positiva"],["neg","Negativa"],["nd","Não doseada"]],null)}
  <div class="warnband" id="w_tp" style="display:none">⚠ <b>Pedir troponina: é necessária para fechar a estratificação</b> (distingue intermédio-alto de intermédio-baixo e é condição do baixo risco).</div>
  <details class="aha" id="ahaBox" ${ST.data._ahaOn?"open":""}>
    <summary>Classificar também pela AHA/ACC 2026<small>Opcional: acrescenta 4 perguntas e identifica os candidatos a trombólise dirigida por cateter. Clique para abrir.</small></summary>
    <div class="db">
      <div id="w_e" style="display:none">
        <p style="font-size:14px;font-weight:700;margin:8px 0 4px">Gravidade do choque</p>
        ${radioRow("q_e",[["e1","Choque persistente (responde a suporte)"],["e2","Refratário ou paragem"]],"e1")}
      </div>
      <div id="w_htblock">
      <p style="font-size:14px;font-weight:700;margin:10px 0 4px">Hipotensão transitória? <span class="mini">(TAS &lt;90 ou queda &gt;40 mmHg &lt;15 min, ou a responder a fluidos)</span></p>
      ${radioRow("q_ht",[["nao","Não"],["sim","Sim"]],"nao")}
      <div id="w_hp" style="display:none">
        <p style="font-size:14px;font-weight:700;margin:10px 0 4px">Marcador de hipoperfusão?</p>
        ${radioRow("q_hp",[["nao","Não"],["sim","Sim"]],"nao")}
        <p class="mini">Lactato &gt;2 mmol/L · LRA ou débito urinário &lt;0,5 mL/kg/h · alteração do estado de consciência · índice cardíaco &lt;2,2 · PAM &lt;60 mmHg.</p>
      </div>
      </div>
      <p style="font-size:14px;font-weight:700;margin:10px 0 4px">Apresentação e extensão</p>
      ${radioRow("q_pres",[["sint","Sintomático"],["inc","Assintomático / incidental"]],"sint")}
      ${radioRow("q_ext",[["seg","Segmentar ou mais proximal"],["sub","Subsegmentar isolada"]],"seg")}
      <p style="font-size:14px;font-weight:700;margin:10px 0 4px">Suporte respiratório</p>
      ${radioRow("q_resp",[["nenhum","Nenhum"],["o2","O₂ (ou hipoxemia/taquipneia)"],["alto","O₂ alto débito (&gt;6 L / máscara)"],["vmi","VNI ou VMI"]],"nenhum")}
    </div>
  </details>
  <div class="verdict" id="stratout" style="display:none"></div>
  <div id="stratbtn"></div>
`, after: ()=>{
  SPESI.forEach((s,i)=>$("sp"+i).addEventListener("change",stratCalc));
  $("ahaBox").addEventListener("toggle",()=>{ ST.data._ahaOn=$("ahaBox").open; stratCalc(); });
  const r=ST.data._stratRaw;
  if (r){
    setRadio("q_inst",r.inst); setRadio("q_vd",r.vd); setRadio("q_tp",r.tp);
    if (r.sp) SPESI.forEach((s,i)=>{ if(r.sp[i]) $("sp"+i).checked=true; });
    setRadio("q_e",r.e); setRadio("q_ht",r.ht); setRadio("q_hp",r.hp);
    setRadio("q_pres",r.pres); setRadio("q_ext",r.ext); setRadio("q_resp",r.resp);
  }
  stratCalc();
}};
function setRadio(g,v){ if(v==null) return; const l=document.querySelector("#"+g+' label[data-v="'+v+'"]'); if(l){ document.querySelectorAll("#"+g+" label").forEach(x=>x.classList.remove("on")); l.classList.add("on"); } }
function stratCalc(){
  const inst=rv("q_inst"), vd=rv("q_vd"), tp=rv("q_tp");
  const ahaOn = !!(ST.data._ahaOn && $("ahaBox") && $("ahaBox").open);
  const e=rv("q_e"), ht=rv("q_ht"), hp=rv("q_hp"), pres=rv("q_pres"), ext=rv("q_ext"), resp=rv("q_resp")||"nenhum";
  ST.data._stratRaw = {inst, vd, tp, sp:SPESI.map((s,i)=>!!($("sp"+i)&&$("sp"+i).checked)), e, ht, hp, pres, ext, resp};
  const _top=ST.trail[ST.trail.length-1]; if(_top && _top.id==="conf_strat") _top.snap=snap();
  if ($("w_e")) $("w_e").style.display = inst==="sim"? "block":"none";
  if ($("w_htblock")) $("w_htblock").style.display = inst==="sim"? "none":"block";
  if ($("w_hp")) $("w_hp").style.display = (inst!=="sim" && ht==="sim")? "block":"none";
  $("w_vd").style.display = vd==="nd"? "block":"none";
  $("w_tp").style.display = tp==="nd"? "block":"none";
  const o=$("stratout"), b=$("stratbtn");
  if (!inst || (inst!=="sim" && (!vd || !tp))){ o.style.display="none"; b.innerHTML=""; return; }
  let sp=0; SPESI.forEach((s,i)=>{ if($("sp"+i).checked) sp++; });
  const vdPos=vd==="sim", tpPos=tp==="pos", vdKnown=vd!=="nd", tpKnown=tp!=="nd";
  /* --- ESC --- */
  let esc, det;
  if (inst==="sim"){ esc="ALTO"; det="instabilidade hemodinâmica"; }
  else if (sp===0 && vdKnown && tpKnown && !vdPos && !tpPos){ esc="BAIXO"; det="sPESI 0, sem disfunção do VD, troponina negativa"; }
  else if (vdPos && tpPos){ esc="INTERMÉDIO-ALTO"; det="disfunção do VD + troponina positiva"+(sp>0?" (sPESI "+sp+")":" (apesar de sPESI 0)"); }
  else if (!vdKnown || !tpKnown){ esc="INTERMÉDIO (a completar)"; det="faltam "+(!vdKnown?"avaliação do VD":"")+(!vdKnown&&!tpKnown?" e ":"")+(!tpKnown?"troponina":"")+": não pode ser baixo risco"; }
  else { esc="INTERMÉDIO-BAIXO"; det= sp>0? "sPESI "+sp+", um (ou nenhum) marcador positivo" : (vdPos?"disfunção do VD":"troponina positiva")+" apesar de sPESI 0"; }
  if (ahaOn && inst!=="sim" && ht==="sim" && esc==="BAIXO"){ esc = hp==="sim"? "INTERMÉDIO-ALTO":"INTERMÉDIO-BAIXO"; det="hipotensão transitória"+(hp==="sim"?" com hipoperfusão (choque normotensivo)":"")+": nunca baixo risco"; }
  /* --- AHA (opcional) --- */
  let aha=null;
  if (ahaOn){
    if (inst==="sim") aha = "E"+(e==="e2"?"2":"1") + (resp==="vmi"?"R":"");
    else if (ht==="sim") aha = "D"+(hp==="sim"?"2":"1") + ((resp==="alto"||resp==="vmi")?"R":"");
    else {
      const R = resp!=="nenhum" ? "R" : "";
      if (pres==="inc") aha = "A"+(ext==="sub"?"1":"2")+R;
      else if (sp===0 && vdKnown && tpKnown && !vdPos && !tpPos) aha = "B"+(ext==="sub"?"1":"2")+R;
      else if (!vdKnown || !tpKnown) aha = "C? (completar VD/troponina)";
      else aha = "C"+(1+(vdPos?1:0)+(tpPos?1:0))+R;
    }
  }
  /* stratTxt: ordem: hemodinâmica, respiratório, VD, troponina, sPESI */
  const respTxt = {o2:"sob O₂ suplementar",alto:"sob O₂ de alto débito",vmi:"sob VNI/VMI"};
  const parts=[];
  if (inst==="sim"){
    parts.push("instabilidade hemodinâmica"+(ahaOn?(e==="e2"?" (choque refratário/paragem)":" (choque persistente)"):""));
  } else if (ahaOn && ht==="sim"){
    parts.push("hipotensão transitória"+(hp==="sim"?" com hipoperfusão":" sem hipoperfusão"));
  } else {
    parts.push("sem instabilidade HD");
  }
  if (ahaOn && resp!=="nenhum") parts.push(respTxt[resp]);
  if (inst!=="sim"){
    parts.push(vdKnown?(vdPos?"disfunção do VD":"sem disfunção do VD"):"VD não avaliado");
    parts.push(tpKnown?("troponina "+(tpPos?"positiva":"negativa")):"troponina não doseada");
    parts.push("sPESI "+sp);
  }
  ST.data._strat = {esc, aha, det, txt:parts.join(", "), sp, ht:ahaOn?ht:null, hp, resp};
  o.style.display="block";
  o.className = "verdict "+(esc==="ALTO"?"v-red":esc==="BAIXO"?"v-grn":esc==="INTERMÉDIO-ALTO"?"v-amb":"v-blu");
  o.innerHTML = "<h3>Risco "+esc+" (ESC)"+(aha? " · AHA/ACC: "+aha:"")+"</h3>"+det+".";
  b.innerHTML = '<button class="go" onclick="stratGo()">Continuar</button>';
}
function stratGo(){
  const s=ST.data._strat;
  ST.data.confCls=s.esc.replace(" (a completar)",""); ST.data.ahaCat=s.aha||null; ST.data.stratTxt=s.txt;
  if (s.esc==="ALTO") go("conf_alto","Alto risco");
  else if (s.esc==="BAIXO") go("conf_hestia","Alta precoce?");
  else go("conf_dest","Abordagem");
}
SCREENS.conf_alto = { crumb:"Alto risco", html: () => `
  <p class="kick">TEP · risco alto</p>
  <h2><span class="tag t-red">ALTO RISCO</span> (ESC)${ST.data.ahaCat? " · AHA/ACC: "+esc(ST.data.ahaCat):""}</h2>
  <div class="verdict v-red"><h3>Abordagem</h3><ul>
    <li><b>UCI · reperfusão primária: trombólise sistémica (ESC I B)</b>; trombectomia mecânica ou embolectomia se contraindicada/falhada (AHA 2026: trombectomia razoável em E1).</li>
    <li><b>Anticoagulação parentérica: HNF na fase aguda/peri-lise</b> (bólus 80 U/kg EV + perfusão 18 U/kg/h, ajustar por aPTT 1,5 a 2,5× o controlo ou anti-Xa): é a escolha da ESC no alto risco, reversível e de semivida curta (suspende-se durante a infusão de alteplase e retoma-se sem bólus com aPTT &lt;2× o controlo); durante a infusão do trombolítico a própria AHA considera a evidência insuficiente para preferir a HBPM. <b>Após a lise ou estabilização: transição para HBPM</b>, preferida à HNF (AHA 2026, 1 B-NR). Sem plano de reperfusão, a AHA prefere HBPM à HNF já no início (1 B-R, inclui E1).</li>
    <li>Contactar o <b>centro de referência</b> com capacidade de reperfusão (trombólise dirigida por cateter / trombectomia). <b>PERT</b> = <i>Pulmonary Embolism Response Team</i>, equipa multidisciplinar de resposta ao TEP: onde exista.</li>
  </ul></div>
  <p class="mini">O percurso termina aqui: a anticoagulação de manutenção e a duração decidem-se depois da fase aguda (na alta ou na consulta).</p>
  ${ciTromb()}
  ${ciAC()}
  <button class="go" onclick="ST.data.local='UCI; reperfusão primária (trombólise sistémica); anticoagulação parentérica com HNF na fase aguda/peri-lise (reversível, semivida curta), com transição para HBPM após a lise/estabilização; contactado centro de referência com capacidade de reperfusão.';drawNote();$('notebody').classList.add('open')">📋 Ver a nota</button>
  <button class="go sec" onclick="ST.data.local=ST.data.local||'UCI; reperfusão primária (trombólise sistémica); anticoagulação parentérica.';restart()">⟳ Novo doente</button>
`};
SCREENS.conf_dest = { crumb:"Abordagem", html: () => {
  const cat = ST.data.ahaCat||"";
  const isD = cat.startsWith("D");
  const ia = ST.data.confCls==="INTERMÉDIO-ALTO" || isD, inc = ST.data.confCls==="INTERMÉDIO", hf = ST.data.hestiaFail;
  const ahaDone = ia && !!cat && !/^C\?/.test(cat);
  return `
  <p class="kick">${ST.data.sspe? "TEP subsegmentar isolado" : "TEP · "+esc((ST.data.confCls||"").toLowerCase())}${hf?" · Hestia positivo":""}</p>
  <h2>${ia?'<span class="tag t-amb">INTERMÉDIO-ALTO</span> Internamento com monitorização':inc?'<span class="tag t-blu">A COMPLETAR</span> Internar até completar a estratificação':hf?'<span class="tag t-grn">BAIXO RISCO</span> Internamento (Hestia positivo)':'<span class="tag t-blu">INTERMÉDIO-BAIXO</span> Internamento em enfermaria'}</h2>
  ${ahaDone ? `<div class="verdict v-ac" style="border-width:2px"><h3>➤ Candidato a trombólise dirigida por cateter <span class="mini">(AHA/ACC ${esc(cat)})</span></h3>Discutir <b>precocemente</b> com um centro de referência com trombólise dirigida por cateter <b>se sinais de deterioração incipiente</b>.${info("Porquê a trombólise dirigida por cateter (evidência)",`Foi a classificação AHA/ACC 2026 que identificou este doente como candidato. No ensaio HI-PEITHO (2026), que avaliou a trombólise dirigida por cateter (e não a trombólise sistémica), a intervenção precoce reduziu a descompensação numa população selecionada (disfunção do ventrículo direito, troponina elevada e critérios de gravidade clínica), com um número necessário para tratar de 16 e sem excesso de hemorragia. Estes resultados não devem ser extrapolados a todo o TEP de risco intermédio-alto.`,"HI-PEITHO, NEJM 2026")}</div>` : ""}
  <div class="verdict ${ia?'v-amb':'v-blu'}"><h3>Abordagem</h3><ul>
    ${ia?`<li>Internamento com <b>monitorização 48–72 h</b> (é a janela da descompensação).</li>
    <li><b>Trombólise sistémica apenas de resgate</b> se deterioração hemodinâmica (ESC I B): não de rotina.</li>`
    :inc?`<li>Internar; <b>medir o rácio VD/VE na angio-TC e/ou pedir troponina</b>: sem eles não há baixo risco nem alta.</li>`
    :``}
    <li><b>Iniciar enoxaparina 1 mg/kg 2x/dia</b> <span class="mini">(peso em baixo para a dose; se ClCr &lt;30 mL/min → 1 mg/kg 1x/dia)</span>${ia?"":": em selecionados, DOAC desde o início é alternativa"}.</li>
  </ul></div>
  ${ST.data.falencia ? `<div class="verdict v-amb"><h3>TEP diagnosticado sob anticoagulação: falência</h3><ul>
    <li><b>HBPM em dose terapêutica</b> (enoxaparina, dose em baixo). Não reiniciar o DOAC ou AVK que falhou; se já estava em HBPM, aumentar a dose 25 a 33%.</li>
    <li>Confirmar adesão e dose; no AVK, o INR no evento (um INR subterapêutico traduz subdosagem, não falência).</li>
    <li>Colher já anti-cardiolipina e anti-β2-glicoproteína I (o anticoagulante lúpico fica adiado). Rastreio de neoplasia adequado à idade e sexo.</li>
  </ul><button class="go sec" style="margin:8px 0 0" onclick="go('ac_falencia','Falência')">Ver a abordagem completa da falência</button></div>` : ""}
  ${ia && !ahaDone ? `<div class="warnband">⚠ <b>Sem a classificação AHA/ACC 2026 não é possível determinar se este doente é candidato a trombólise dirigida por cateter</b>, uma vez que é essa classificação que identifica o fenótipo estudado no HI-PEITHO. Volte à estratificação e abra a secção da AHA/ACC; o que já preencheu mantém-se.
    <div style="margin-top:10px"><button class="go" style="margin:0" onclick="ST.data._ahaOn=true;go('conf_strat','Estratificação')">← Voltar e classificar pela AHA/ACC 2026</button></div></div>` : ""}
  ${ia ? info("Trombólise sistémica e trombólise dirigida por cateter: os dois ensaios PEITHO",`
    <table class="itb"><tr><th>Ensaio</th><th>Intervenção</th><th>O que diz</th></tr>
      <tr><td>PEITHO (2014)</td><td>Trombólise <b>sistémica</b> (dose plena)</td><td>Reduz a descompensação, mas aumenta a hemorragia major e o AVC: reserva-se ao resgate, não é de rotina</td></tr>
      <tr><td>HI-PEITHO (2026)</td><td>Trombólise <b>dirigida por cateter</b> (facilitada por ultrassom)</td><td>No risco intermédio-alto selecionado (disfunção do VD, troponina elevada e critérios de gravidade), a intervenção precoce reduz a descompensação</td></tr>
    </table>
    <p class="mini" style="margin:6px 0 0">Trata-se de modalidades terapêuticas distintas, e não de duas versões da mesma intervenção.</p>`,"PEITHO, NEJM 2014; HI-PEITHO, NEJM 2026") : ""}
  ${ia ? `<p class="mini"><b>PERT</b> = <i>Pulmonary Embolism Response Team</i> (equipa multidisciplinar de resposta ao TEP). Poucos hospitais em Portugal têm uma constituída: na prática, contactar o centro de referência com capacidade de reperfusão dirigida por cateter.</p>` : ""}
  <div class="row2">
    <div class="field"><label>Peso (kg)</label><input type="number" id="pw" min="30" max="250" value="${ST.data._pw!=null?ST.data._pw:''}" oninput="pwCalc()"></div>
    <div style="align-self:end;padding-bottom:14px"><span id="pwout" class="mini" style="font-size:14px"></span></div>
  </div>
  <details class="paste" id="crclBox" ${ST.data._crclOpen?"open":""}>
    <summary>Calcular a função renal (Cockcroft-Gault) <small>(opcional)</small></summary>
    <div class="db">
      <div class="row2">
        <div class="field"><label>Idade (anos)</label><input type="number" id="cgAge" min="18" max="120" value="${ST.data._cgAge!=null?ST.data._cgAge:''}" oninput="cgCalc()"></div>
        <div class="field"><label>Creatinina (mg/dL)</label><input type="number" step="0.01" id="cgCr" min="0.2" max="20" value="${ST.data._cgCr!=null?ST.data._cgCr:''}" oninput="cgCalc()"></div>
      </div>
      <p style="font-size:13.5px;font-weight:700;margin:10px 0 4px">Sexo</p>
      <div class="radio3" id="cgSex">
        <label data-v="M"${ST.data._cgSex==='M'?' class="on"':''} onclick="cgSexSel('M')"><input type="radio">Masculino</label>
        <label data-v="F"${ST.data._cgSex==='F'?' class="on"':''} onclick="cgSexSel('F')"><input type="radio">Feminino</label>
      </div>
      <div class="verdict" id="cgOut" style="margin-top:10px"></div>
      <p class="mini" style="margin:8px 0 0">A Cockcroft-Gault (mL/min) é a fórmula de referência para o ajuste de dose dos anticoagulantes (foi a usada nos ensaios e nos RCP). A CKD-EPI 2021 serve para estadiar a doença renal, não para decidir a dose.</p>
      ${info("A Cockcroft-Gault pode sobrestimar a função renal",`
        <p style="margin:0 0 6px"><b>Quando desconfiar:</b> idoso frágil ou com pouca massa muscular, caquexia, extremos de peso. Nestes doentes a creatinina sérica pode estar dentro dos valores de referência apesar de uma função renal reduzida, e a fórmula sobrestima a clearance.</p>
        <p style="margin:0"><b>O que fazer:</b> assumir que a função renal é mais baixa do que o número indica e dosear de forma conservadora. Se a dose ficar no limiar de um corte (por exemplo, ClCr perto de 30), pedir cistatina C ou clearance medido (urina 24 h), ou apoio da Nefrologia.</p>`,"KDIGO; RCP dos anticoagulantes (cortes de dose em ClCr por Cockcroft-Gault)")}
    </div>
  </details>
  ${ia ? ciTromb() : ""}
  ${situInfo()}
  ${ciAC()}
  <button class="go" onclick="destGo()">Concluir: nota do episódio</button>
`;}, after: ()=>{ const cb=$("crclBox"); if(cb) cb.addEventListener("toggle",()=>{ ST.data._crclOpen=cb.open; destSnap(); }); pwCalc(); cgCalc(); }};
/* enoxaparina 1 mg/kg: 2x/dia; 1x/dia se ClCr <30 mL/min (Cockcroft-Gault calculada neste ecrã) */
function enoxTxt(w){ const low = ST.data._crcl!=null && ST.data._crcl<30; return {low, f: low? "1x/dia":"2x/dia", mg: w? enoxDose(w):null}; }
function pwOut(){
  const o=$("pwout"); if(!o) return;
  const w=ST.data._pw; if(w==null){ o.innerHTML=""; return; }
  const e=enoxTxt(w);
  o.innerHTML = "<b>enoxaparina "+e.mg+" mg "+e.f+"</b> (1 mg/kg"+(e.low?", ClCr &lt;30 mL/min":"")+")";
}
function pwCalc(){
  const w = parseInt(($("pw")||{}).value);
  ST.data._pw = isNaN(w)? null : w;
  destSnap(); cgCalc(); pwOut();
}
function cgSexSel(v){ ST.data._cgSex=v; document.querySelectorAll('#cgSex label').forEach(x=>x.classList.toggle('on', x.dataset.v===v)); cgCalc(); }
function cgCalc(){
  const age=parseFloat(($("cgAge")||{}).value), cr=parseFloat(($("cgCr")||{}).value), w=parseFloat(($("pw")||{}).value);
  ST.data._cgAge=isNaN(age)?null:age; ST.data._cgCr=isNaN(cr)?null:cr;
  const o=$("cgOut"); destSnap(); if(!o) return;
  const sex=ST.data._cgSex;
  const falta=[]; if(isNaN(w)) falta.push("peso"); if(isNaN(age)) falta.push("idade"); if(!sex) falta.push("sexo"); if(isNaN(cr)) falta.push("creatinina");
  if(falta.length){ o.className="verdict v-blu"; o.innerHTML="Falta preencher: <b>"+falta.join(", ")+"</b>."; ST.data._crcl=null; pwOut(); return; }
  let crcl=((140-age)*w)/(72*cr); if(sex==="F") crcl*=0.85;
  crcl=Math.round(crcl); ST.data._crcl=crcl;
  const low=crcl<30;
  o.className="verdict "+(low?"v-amb":"v-grn");
  o.innerHTML="<h3>ClCr ≈ "+crcl+" mL/min <span class='mini' style='font-weight:400'>(peso "+w+" kg)</span></h3>"+(low
    ? "<b>&lt;30 mL/min:</b> enoxaparina <b>1 mg/kg 1x/dia</b>. Rever o ajuste renal do DOAC (dabigatrano contraindicado; edoxabano 30 mg 1x/dia; apixabano/rivaroxabano com cautela)."
    : "≥30 mL/min: enoxaparina 1 mg/kg 2x/dia, sem ajuste renal específico da HBPM.");
  pwOut();
}
function destSnap(){ const t=ST.trail[ST.trail.length-1]; if(t && t.id==="conf_dest") t.snap=snap(); }
function destGo(){
  const cat = ST.data.ahaCat||"";
  const isD = cat.startsWith("D");
  const ia = ST.data.confCls==="INTERMÉDIO-ALTO" || isD, inc = ST.data.confCls==="INTERMÉDIO";
  const ahaDone = ia && !!cat && !/^C\?/.test(cat);
  const w = ST.data._pw;
  ST.data.local = (ia? "internamento com monitorização"
        : inc? "internamento até completar estratificação (VD/troponina)"
        : "internamento em enfermaria");
  ST.data.cdtNote = ahaDone
    ? "Candidato a trombólise dirigida por cateter (AHA/ACC "+cat+") a discutir precocemente com centro de referência se deterioração incipiente"
    : (ia ? "Candidatura a trombólise dirigida por cateter por definir: classificar pela AHA/ACC 2026" : null);
  const e = enoxTxt(w);
  ST.data.regime = "enoxaparina 1 mg/kg "+e.f+(w? " ("+e.mg+" mg "+e.f+")":"")+(e.low? "; dose renal por ClCr ≈ "+ST.data._crcl+" mL/min (Cockcroft-Gault)":"")+".";
  go("conf_fim","Plano");
}
const HESTIA = [
  ["Instável hemodinamicamente?","PAS <100 mmHg com FC >100 bpm, necessidade de cuidados intensivos, ou por juízo clínico."],
  ["Necessita de trombólise ou embolectomia?","Por motivo diferente da instabilidade hemodinâmica."],
  ["Hemorragia ativa ou alto risco hemorrágico?","Hemorragia digestiva ou cirurgia há ≤2 semanas, AVC há ≤1 mês, diátese hemorrágica ou plaquetas <75×10⁹/L, hipertensão não controlada (PAS >180 ou PAD >110 mmHg), ou por juízo clínico."],
  ["Necessita de O₂ >24 h para SpO₂ >90%?",""],
  ["TEP diagnosticado já sob anticoagulação?",""],
  ["Dor grave a exigir analgesia EV >24 h?",""],
  ["Razão médica ou social para internamento >24 h?","Por exemplo infeção, neoplasia ou ausência de apoio social."],
  ["ClCr < 30 mL/min?","Calculada pela fórmula de Cockcroft-Gault."],
  ["Compromisso hepático grave?","Por juízo clínico."],
  ["Grávida?",""],
  ["História de trombocitopenia induzida pela heparina?","Documentada."]
];
SCREENS.conf_hestia = { crumb:"Alta precoce", html: () => `
  <p class="kick">TEP · baixo risco</p>
  <h2>Alta precoce: Hestia (qualquer "sim" exclui)</h2>
  <p class="sub">${ST.data.sspe? "No subsegmentar isolado o risco é baixo pelo próprio calibre do trombo, por isso não se pedem VD nem troponina: o Hestia serve aqui só para decidir a disposição (casa ou enfermaria)." : "Alta precoce (ESC IIa A) exige: baixo risco confirmado <b>com VD e troponina</b>; sem comorbilidade que exija internamento; circuito ambulatório e consulta assegurados."}</p>
  ${HESTIA.map((h,i)=>chk("h"+i,h[0]+(h[1]?'<span class="hdef">'+h[1]+'</span>':""))).join("")}
  <div class="verdict" id="hout"></div>
  ${bleedInfo("hestia")}
  <div id="hbtn"></div>
  ${info("A evidência da alta precoce",`
    <p style="margin:0 0 8px">A alta precoce (ou o tratamento no domicílio) é segura no TEP de baixo risco selecionado. O que a sustenta:</p>
    <table class="itb"><tr><th>Estudo</th><th>O que mostrou</th></tr>

    </table>
    <p class="mini" style="margin:8px 0 0">A ESC 2019 recomenda-o (Classe IIa A) desde que o seguimento e a anticoagulação estejam assegurados.</p>`,"HOME-PE, Eur Heart J 2021; HoT-PE, Eur Heart J 2020; ESC 2019; AHA/ACC 2026")}
  ${situInfo()}
  ${ciAC()}
`, after: ()=>{ HESTIA.forEach((h,i)=>$("h"+i).addEventListener("change",hCalc)); hCalc(); }};
function hCalc(){
  let n=0; HESTIA.forEach((h,i)=>{ if($("h"+i).checked) n++; });
  ST.data._hn=n; const o=$("hout");
  o.className="verdict "+(n===0?"v-grn":"v-amb");
  o.innerHTML = n===0? "<h3>Hestia 0 → elegível para alta precoce com DOAC</h3>" : "<h3>"+n+" critério(s) presente(s) → internar</h3>";
  $("hbtn").innerHTML='<button class="go" onclick="hGo()">Continuar</button>';
}
function hGo(){
  if ($("h4") && $("h4").checked) ST.data.falencia = true; /* TEP diagnosticado já sob anticoagulação */
  if (ST.data._hn===0){
    ST.data.local = "alta precoce (baixo risco, Hestia 0)";
    ST.data.acCtx='alta'; go("ac_pick","Anticoagulação");
  } else {
    ST.data.hestiaFail=true; go("conf_dest","Abordagem");
  }
}
SCREENS.conf_fim = { crumb:"Plano final", html: () => `
  <p class="kick">Episódio · concluído</p>

/* ============ ALTA DO INTERNADO ============ */
function fmtD(offset){
  const t = new Date(); t.setDate(t.getDate()+(offset||0));
  const p = n => (n<10?"0":"")+n;
  return p(t.getDate())+"/"+p(t.getMonth()+1);
}
SCREENS.alta_int = { crumb:"Para casa", html: () => `
  <p class="kick">Anticoagulação para casa</p>
  <h2>Passar de enoxaparina para anticoagulante oral</h2>
  <div class="field"><label>Dias de anticoagulação já cumpridos no internamento</label><input type="number" id="aidays" min="0" max="60" value="${ST.data._aidays!=null?ST.data._aidays:''}" oninput="aiCalc()"></div>
  <button class="go sec" onclick="openModal('m_situ')">⚠ Situações que mudam a escolha</button>
  <div class="opts" id="aiopts"></div>
  <p class="mini">Regra da troca: iniciar o oral <b>à hora da próxima dose de enoxaparina</b> (omitindo-a). Edoxabano e dabigatrano exigem <b>≥5 dias de parentérico antes</b> de começar. No apixabano e rivaroxabano faz-se a <b>fase de dose alta completa a partir do 1.º comprimido oral</b>: os dias de enoxaparina <b>não contam</b> para essa fase (não validado). Se já houve lead-in parentérico, o encaixe validado é o edoxabano ou o dabigatrano.</p>
  ${ciAC()}
`, after: ()=>{ aiCalc(); }};
function aiCalc(){
  const dRaw = ($("aidays")||{}).value, d = parseInt(dRaw);
  const dd = isNaN(d)? 0 : d, has = !isNaN(d);
  ST.data._aidays = has? d : null; snapTop("alta_int");
  const box = $("aiopts");
  if (!has){ box.innerHTML = '<div class="verdict v-blu">Indique os dias de anticoagulação já cumpridos: os planos ajustam-se automaticamente (com datas reais).</div>'; return; }
  const faltam5 = Math.max(0, 5-dd);
  const edoSub = faltam5>0
    ? "enoxaparina mais "+faltam5+" dia"+(faltam5>1?"s":"")+" (termina "+fmtD(faltam5)+") &gt; depois edoxabano 60 mg 1x/dia"
    : "60 mg 1x/dia: parentérico ≥5 dias já cumprido";
  const dabSub = faltam5>0
    ? "enoxaparina mais "+faltam5+" dia"+(faltam5>1?"s":"")+" (termina "+fmtD(faltam5)+") &gt; depois dabigatrano 150 mg 2x/dia"
    : "150 mg 2x/dia: parentérico ≥5 dias já cumprido";
  const apxSub = "10 mg 2x/dia durante 7 dias (até "+fmtD(7)+"), depois 5 mg 2x/dia";
  const rvxSub = "15 mg 2x/dia durante 21 dias (até "+fmtD(21)+"), depois 20 mg 1x/dia, com alimentos";
  box.innerHTML = `
    <button class="opt" onclick="aiGo('edo')"><b>Edoxabano</b><small>${edoSub}</small></button>
    <button class="opt" onclick="aiGo('apx')"><b>Apixabano</b><small>${apxSub}</small></button>
    <button class="opt" onclick="aiGo('rvx')"><b>Rivaroxabano</b><small>${rvxSub}</small></button>
    <button class="opt" onclick="aiGo('dab')"><b>Dabigatrano</b><small>${dabSub}</small></button>
    <button class="opt" onclick="aiGo('eno')"><b>Manter enoxaparina</b><small>1 mg/kg 2x/dia; 1x/dia se ClCr &lt;30 mL/min (ex.: neoplasia GI/GU luminal, gravidez, ClCr &lt;30)</small></button>`;
}
function aiGo(drug){
  const d = parseInt(($("aidays")||{}).value), dd = isNaN(d)? 0 : d;
  const faltam5 = Math.max(0, 5-dd);
  let l1;
  if (drug==="edo"){
    l1 = faltam5>0
      ? "Alta medicado com enoxaparina mais "+faltam5+" dia"+(faltam5>1?"s":"")+" (termina "+fmtD(faltam5)+") - inicia depois edoxabano 60 mg 1x/dia até à consulta"
      : "Alta medicado com edoxabano 60 mg 1x/dia até à consulta (parentérico ≥5 dias cumprido no internamento)";
  } else if (drug==="dab"){
    l1 = faltam5>0
      ? "Alta medicado com enoxaparina mais "+faltam5+" dia"+(faltam5>1?"s":"")+" (termina "+fmtD(faltam5)+") - inicia depois dabigatrano 150 mg 2x/dia até à consulta"
      : "Alta medicado com dabigatrano 150 mg 2x/dia até à consulta (parentérico ≥5 dias cumprido no internamento)";
  } else if (drug==="apx"){
    l1 = "Alta medicado com apixabano 10 mg 2x/dia durante 7 dias (até "+fmtD(7)+"), depois 5 mg 2x/dia até à consulta";
  } else if (drug==="rvx"){
    l1 = "Alta medicado com rivaroxabano 15 mg 2x/dia durante 21 dias (até "+fmtD(21)+"), depois 20 mg 1x/dia (com alimentos) até à consulta";
  } else {
    l1 = "Alta medicado com enoxaparina 1 mg/kg 2x/dia (1x/dia se ClCr <30 mL/min) até à consulta";
  }
  ST.data._altaDrug = drug;
  ST.data.altaInt = [l1, "Marcada consulta Medicina Interna - TEV em 3 meses"];
  go("alta_fim","Concluído");
}
const ALTA_CHK = {
  edo: "Reduzir o edoxabano para <b>30 mg 1x/dia</b> se: peso ≤60 kg, ClCr 30–50 mL/min, ou uso de ciclosporina, dronedarona, eritromicina ou cetoconazol.",
  apx: "Deixar <b>por escrito a data da passagem de 10 mg → 5 mg 2x/dia</b>; é 2x/dia: reforçar a adesão.",
  rvx: "Deixar <b>por escrito a data da passagem de 15 mg 2x/dia → 20 mg 1x/dia</b>; tomar sempre <b>com alimentos</b> (absorção).",
  dab: "Reduzir para <b>110 mg 2x/dia se ≥80 anos</b> (ou verapamilo); não abrir as cápsulas; dispepsia é frequente: tomar com água e às refeições.",
  eno: "Ensinar a <b>autoadministração</b> (ou assegurar quem administra) e entregar material; verificar função renal e plaquetas na consulta."
};

`};
