<script>
"use strict";
/* ============ P1 · TVP (v2) ============ */
const WTVP = [
  ["Neoplasia ativa (tratamento <6 meses ou paliativo)",1],
  ["Paralisia, parésia ou imobilização gessada do MI",1],
  ["Acamado ≥3 dias ou grande cirurgia <12 semanas",1],
  ["Dor à palpação ao longo do trajeto venoso profundo",1],
  ["Edema de todo o membro",1],
  ["Perímetro gemelar >3 cm que o contralateral",1],
  ["Edema com godet confinado ao membro sintomático",1],
  ["Veias colaterais superficiais (não varicosas)",1],
  ["TVP prévia documentada",1],
  ["Diagnóstico alternativo pelo menos tão provável",-2]
];
SCREENS.tvp_wells = { crumb:"Wells TVP", html: () => `
  <p class="kick">Suspeita de TVP · passo 1</p>
  <h2>Wells de TVP</h2>
  <div class="warnband"><b>Grávida (ou pós-parto ≤6 semanas):</b> não usar Wells nem D-dímeros. Pedir eco-doppler de todo o membro diretamente (ESVS 2021).
    <div style="margin-top:10px"><button class="go sec" style="margin:0" onclick="ST.data.gravidaTvp=true;go('tvp_eco','Eco-doppler')">Grávida: ir diretamente para a eco-doppler</button></div></div>
  ${WTVP.map((w,i)=>chk("wt"+i,w[0],w[1])).join("")}
  <div class="verdict v-ac" id="wtout" style="display:none"></div>
  <button class="go" onclick="wtGo()">Continuar</button>
  ${info("Interpretação",`
    <table class="itb"><tr><th>Pontos</th><th>Classificação</th><th>Próximo passo</th></tr>
      <tr><td>≥ 2</td><td>TVP provável</td><td>Eco-doppler direto</td></tr>
      <tr><td>&lt; 2</td><td>TVP improvável</td><td>D-dímeros primeiro; eco só se positivos</td></tr>
    </table>`,"Wells, NEJM 2003; ESVS 2021")}
`, after: ()=>{ WTVP.forEach((w,i)=>$("wt"+i).addEventListener("change",wtCalc)); const r=ST.data._wtRaw; if(r) WTVP.forEach((w,i)=>{ if(r[i]&&$("wt"+i)) $("wt"+i).checked=true; }); wtCalc(); }};
function wtCalc(){
  let s=0; WTVP.forEach((w,i)=>{ if($("wt"+i).checked) s+=w[1]; });
  ST.data._wtRaw=WTVP.map((w,i)=>!!($("wt"+i)&&$("wt"+i).checked)); snapTop("tvp_wells");
  ST.data._wt=s; const o=$("wtout"); o.style.display="block";
  o.innerHTML="<h3>"+s+" pontos: TVP "+(s>=2?"<b>provável</b> → eco-doppler direto":"<b>improvável</b> → D-dímeros primeiro")+"</h3>";
}
function wtGo(){ ST.data.wtvp=ST.data._wt; if(ST.data.wtvp>=2) go("tvp_eco","Eco-doppler"); else go("tvp_dd","D-dímeros"); }
SCREENS.tvp_dd = { crumb:"D-dímeros", html: () => `
  <p class="kick">Suspeita de TVP · improvável</p>
  <h2>D-dímeros (limiar ajustado à idade)</h2>
  <div class="row2">
    <div class="field"><label>Idade (anos)</label><input type="number" id="tdage" oninput="tdCalc()"></div>
    <div class="field"><label>D-dímeros ${ddUnitTog("tdval","tdCalc")}<span style="font-weight:400;color:var(--mut)">FEU</span></label><input type="text" inputmode="decimal" id="tdval" oninput="tdCalc()"></div>
  </div>
  <div class="verdict" id="tdout" style="display:none"></div>
  <div id="tdbtns"></div>
  ${info("Como funciona o limiar",`
    <table class="itb"><tr><th>Idade</th><th>Limiar de D-dímeros</th></tr>
      <tr><td>≤ 50 anos</td><td><b>0,50 mg/L (500 µg/L)</b></td></tr>
      <tr><td>&gt; 50 anos</td><td><b>idade × 10</b> µg/L (ex.: 72 anos → 720 µg/L = 0,72 mg/L)</td></tr>
    </table>
    <p class="mini" style="margin:6px 0 0">Valores em mg/L (µg/L entre parêntesis; 1 mg/L = 1000 µg/L). Não validado sob anticoagulação terapêutica.</p>`,"Schouten, BMJ 2013 (meta-análise, TVP e TEP); ADJUST-PE, JAMA 2014")}
`, after: ()=>{ const r=ST.data._tdraw; if(r){ $("tdage").value=r.age??""; $("tdval").value=r.val??""; } tdCalc(); }};
function tdCalc(){
  const age=parseInt($("tdage").value), val=ddToUg($("tdval").value);
  const o=$("tdout"), b=$("tdbtns");
  ST.data._tdraw={age:$("tdage").value,val:$("tdval").value};
  snapTop("tvp_dd");
  if(isNaN(age)||isNaN(val)){o.style.display="none";b.innerHTML="";return;}
  const thr = age>50? age*10:500, excl = val<thr;
  ST.data._td={val,thr,excl,ageAdj:age>50};
  o.style.display="block"; o.className="verdict "+(excl?"v-grn":"v-amb");
  o.innerHTML="<h3>"+ddFmt(val)+" vs "+ddFmt(thr)+" → "+(excl?"TVP <b>excluída</b> sem imagem":"<b>eco-doppler</b> indicado")+"</h3>";
  b.innerHTML = excl
    ? '<button class="go" onclick="ST.data.tvpdd=ST.data._td;go(\'tvp_excl\',\'Excluída\')">Concluir: excluída</button>'
    : '<button class="go" onclick="ST.data.tvpdd=ST.data._td;go(\'tvp_eco\',\'Eco-doppler\')">Prosseguir para eco</button>';
}
SCREENS.tvp_excl = { crumb:"Excluída", html: () => `
  <p class="kick">Suspeita de TVP · concluído</p>
  <h2><span class="tag t-grn">EXCLUÍDA</span> Improvável + D-dímeros negativos</h2>
  <div class="verdict v-grn"><h3>Alta: sem imagem</h3><ul><li>Explicar sinais de alarme; tratar o diagnóstico alternativo.</li></ul></div>
  <button class="go sec" onclick="restart()">⟳ Novo doente</button>
`};
SCREENS.tvp_eco = { crumb:"Eco-doppler", html: () => `
  <p class="kick">TVP</p>
  <h2>Eco-doppler: de <u>todo</u> o membro</h2>
  <p class="sub">Um protocolo só proximal perde a distal e obriga a repetir aos 5–7 dias. Na suspeita de TVS, a eco deve ser bilateral (ESVS 2021).</p>
  <div class="opts">
    <button class="opt" onclick="ecoSet('proximal');go('tvp_prox','Proximal')"><b>TVP proximal</b><small>VCI · ilíaca comum · ilíaca externa · femoral comum · femoral · femoral profunda · poplítea</small></button>
    <button class="opt" onclick="ecoSet('distal');go('tvp_distal','Distal')"><b>TVP distal isolada</b><small>Abaixo da poplítea: tibiais/peronial ou musculares (solear, gemelar)</small></button>
    <button class="opt" onclick="ecoSet('tvs');go('tvp_tvs','TVS')"><b>Trombose venosa superficial</b><small>Cordão em veia superficial, sem envolvimento profundo</small></button>
    <button class="opt" onclick="ecoSet('neg');go('tvp_econeg','Negativa')"><b>Negativa</b></button>
    <button class="opt" onclick="go('tvp_noite','Sem eco')"><b>Eco não disponível de imediato</b><small>Noite / fim-de-semana sem ecografista</small></button>
  </div>
  <details class="paste" id="ecoBox" ${ST.data.ecoFull?"open":""}>
    <summary>Colar aqui a parte relevante do relatório da eco-doppler <small>(opcional)</small></summary>
    <div class="db">
      <p class="mini" style="margin:0 0 8px"><b>Substitui</b> a descrição simples na nota (para incluir a veia, o lado e a extensão).</p>
      <textarea id="ecoFullIn" rows="2" style="width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical" placeholder="ex.: trombose da veia femoral comum e femoral à esquerda, sem extensão ilíaca">${esc(ST.data.ecoFull||"")}</textarea>
    </div>
  </details>
`};
function ecoSet(v){
  ST.data.eco=v;
  ST.data.ecoTxt = {proximal:"TVP proximal",distal:"TVP distal isolada",tvs:"trombose venosa superficial",neg:"sem trombose"}[v];
  const full = (($("ecoFullIn")||{}).value||"").trim();
  ST.data.ecoFull = full || null;
}
SCREENS.tvp_noite = { crumb:"Sem eco", html: () => `
  <p class="kick">TVP · imagem indisponível</p>
  <h2><span class="tag t-blu">SEM ECO DISPONÍVEL</span> O que fazer até haver ecografia</h2>
  <div class="verdict v-blu"><h3>Abordagem</h3><ul>
    <li><b>TVP provável (Wells ≥2)</b> → <b>iniciar anticoagulação empírica</b> (enoxaparina 1 mg/kg ou 1.ª toma de DOAC) e <b>eco-doppler nas primeiras 24 h</b>. Esta abordagem é segura e é a recomendada: o tratamento não deve ser adiado até haver ecografia disponível (CHEST 2016; NICE NG158).</li>
    <li><b>TVP improvável</b> → D-dímeros; se negativos com limiar ajustado, excluída sem imagem; se positivos, anticoagulação empírica ponderada caso a caso + eco nas 24 h.</li>
    <li>A angio-TC venosa reserva-se à eco inconclusiva ou impraticável e à suspeita de extensão iliocava (ESVS 2021); não substitui a eco quando o problema é apenas o horário.</li>
    <li>Exceção: suspeita de flegmasia (membro azul, frio, dor intensa) → contactar a especialidade competente de urgência.</li>
  </ul></div>
  ${situInfo()}
  ${ciAC()}
  <button class="go" onclick="ST.data.ecoNoite=true;go('tvp_eco','Eco-doppler')">Já tenho a eco →</button>
  <button class="go sec" onclick="noiteGo()">Concluir: plano até haver eco</button>
`};
function noiteGo(){
  ST.data.ecoNoite = true;
  ST.data.ecoConduta = "decidir com o resultado da eco-doppler das primeiras 24 h";
  go('tvp_fim','Plano');
}
SCREENS.tvp_prox = { crumb:"Proximal", html: () => `
  <p class="kick">TVP proximal</p>
  <h2><span class="tag t-amb">TRATAR</span> Anticoagulação em dose de tratamento</h2>
  <div class="verdict v-amb"><h3>Abordagem</h3><ul>
    <li><b>Iniciar anticoagulação em dose de tratamento</b> (escolher no passo seguinte). O tratamento é <b>ambulatório na maioria</b> dos doentes.</li>
    <li><b>Mobilização precoce</b> conforme tolerado; não é necessário repouso no leito.</li>
    <li>Meia elástica <b>apenas se sintomática</b> (dor ou edema): pode aliviar os sintomas, mas não demonstrou prevenir de forma consistente o síndrome pós-trombótico (SOX). <span class="mini">ASH 2020; CHEST 2021; SOX Trial (Kahn et al., Lancet 2014).</span></li>
    <li><b>Referenciar à consulta</b>: definir a duração da anticoagulação e investigar fatores predisponentes, quando indicado.</li>
  </ul></div>
  <div class="warnband"><b>Situações que justificam orientação especializada precoce:</b> flegmasia, TVP iliofemoral sintomática com menos de 14 dias de evolução e baixo risco hemorrágico, suspeita de extensão à veia cava inferior, TVP bilateral, progressão da trombose apesar de anticoagulação adequada ou contraindicação à anticoagulação. Outras situações complexas podem justificar discussão com a especialidade competente.</div>
  ${info("Porquê ambulatório?","Na ausência de instabilidade clínica, elevado risco hemorrágico, dor ou edema incapacitantes, necessidade de analgesia parentérica ou problemas sociais que impeçam o tratamento, a TVP proximal pode ser tratada em ambulatório com segurança equivalente à hospitalização.","ESVS 2021; ASH 2020; CHEST 2021")}
  ${situInfo()}
  ${ciAC()}
  <button class="go blk" onclick="proxGo('amb')">Tratar em ambulatório: escolher anticoagulação</button>
  <button class="go sec blk" onclick="proxGo('int')">Internar: escolher anticoagulação</button>
`};
function proxGo(dest){
  if (dest==='amb'){
    ST.data.ecoConduta = "anticoagulação em dose de tratamento, em ambulatório.";
    ST.data.acCtx = 'amb';
  } else {
    ST.data.ecoConduta = "anticoagulação em dose de tratamento, com internamento (ver os motivos de orientação especializada precoce).";
    delete ST.data.acCtx;
  }
  go('ac_pick','Anticoagulação');
}
SCREENS.tvp_distal = { crumb:"Distal", html: () => `
  <p class="kick">TVP distal isolada</p>
  <h2>Anticoagular, salvo risco hemorrágico</h2>

  <button class="go blk" onclick="distalGo(true)">Anticoagular em dose de tratamento</button>
  <button class="go sec blk" onclick="distalGo(false)">Risco hemorrágico elevado: vigiar com eco</button>

  <p class="mini" style="margin-top:14px"><b>Duração:</b> 3 meses (ESVS 2021; RIDTS). Prolongar ou não decide-se em consulta.</p>

  ${bleedInfo("distal")}

  ${info("O que reforça a decisão de tratar",`
    <p style="margin:0 0 6px">Neoplasia ativa, TEV prévio, TVP não provocada, trombo extenso (mais de 5 cm, várias veias, junto à trifurcação poplítea ou com mais de 7 mm) e internamento ou imobilidade persistente. As veias axiais (tibiais e peronial) estendem mais do que as musculares (solear e gemelar), mas a conduta por defeito é a mesma.</p>
    <p style="margin:0">Dois critérios do CHEST, "sintomas graves" e "D-dímeros muito elevados", são qualitativos e sem valor de corte: servem de juízo clínico, não de número.</p>`,
    "CHEST 2016 (Kearon, Chest 2016;149:315); update 2021 (Stevens, Chest 2021;160:e545)")}

  ${info("Tratar ou vigiar: o que dizem os estudos",`
    <p style="margin:0 0 6px">O CHEST admite vigilância ecográfica na distal isolada de baixo risco, mas a evidência recente inclinou-se para tratar. Sem tratamento, 11 a 16% estendem ao território proximal; na meta-análise da ESVS, 3 meses de anticoagulação reduziram o TEV de 18,6% para 1,5% (NNT 6).</p>
    <p style="margin:0 0 6px">No <b>CACTUS</b> (só baixo risco), anticoagular não reduziu de forma significativa a extensão ou o TEP (3% vs 5%) e acrescentou hemorragia (4% vs 0%): é o argumento a favor da vigilância no baixo risco. No <b>RIDTS</b>, 3 meses de rivaroxabano foram melhores do que 6 semanas na recorrência: é o argumento para não encurtar quando se trata.</p>
    <p style="margin:0"><b>Na prática anticoagula-se a maioria</b>, e a vigilância fica reservada ao risco hemorrágico elevado.</p>`,
    "ESVS 2021 (Kakkos, Eur J Vasc Endovasc Surg 2021;61:9); CHEST 2016 (Kearon); update 2021 (Stevens); CACTUS, Lancet Haematol 2016; RIDTS 2022; Potere & Ageno, Pol Arch Intern Med 2023")}
  ${situInfo()}
  ${ciAC()}
`};
function distalGo(ac){
  if (ac){
    ST.data.ecoConduta = "TVP distal isolada > anticoagulação em dose de tratamento, 3 meses (prolongamento a decidir em consulta)";
    ST.data.acCtx='amb'; go("ac_pick","Anticoagulação");
  } else {
    ST.data.ecoConduta = "TVP distal isolada com risco hemorrágico elevado > vigilância ecográfica (repetir eco de todo o membro ao dia 7 e, se negativa, ao dia 14; anticoagular se extensão); decisão documentada e reavaliação marcada";
    go("tvp_fim","Plano");
  }
}

    <button class="opt" onclick="acGo('dabi')"><b>Dabigatrano</b><small>150 mg 2x/dia após ≥5 d de HBPM (110 se ≥80 anos)</small></button>
    <button class="opt" onclick="acGo('hbpm')"><b>Enoxaparina</b><small>1 mg/kg 2x/dia; 1x/dia se ClCr &lt;30 mL/min (neoplasia GI, gravidez, instabilidade)</small></button>
    <button class="opt" onclick="acGo('avk')"><b>Varfarina (AVK) / acenocumarol</b><small>Sobreposição de enoxaparina ≥5 dias e até INR ≥2 ×2; referenciar à consulta de hipocoagulação (SAF; ClCr &lt;15)</small></button>
  </div>
  <p class="mini">NOAC preferido ao AVK (ESC I A; ESVS 2021 I A). Se parentérico inicial: HBPM &gt; HNF (AHA 2026, Classe 1 B-R).</p>
  ${ciAC()}
`};
function acGo(k){
  ST.data.acDrug = k;
  if (k==="hbpm"){ ST.data._hbpmFrom="ac"; go("ac_hbpm","Dose"); return; }
  ST.data.regime = AC[k]+".";
  go("ac_fim","Plano");
}
/* a enoxaparina precisa do peso (e da função renal) para a nota levar a dose decidida, e não a regra */

function hbpmBtn(){
  const b=$("hbpmbtn"); if(!b) return;
  b.innerHTML = ST.data._pw? '<button class="go blk" onclick="hbpmGo()">Concluir com esta dose</button>'
                           : '<div class="verdict v-blu">Indique o peso para calcular a dose.</div>';
}
function hbpmGo(){
  const w = ST.data._pw, e = enoxTxt(w);
  const dose = "enoxaparina 1 mg/kg "+e.f+" ("+e.mg+" mg)"+(e.low? ", dose reduzida por ClCr ≈ "+ST.data._crcl+" mL/min (Cockcroft-Gault)":"");
  if (ST.data._hbpmFrom==="alta"){
    ST.data._altaDrug = "eno";
    ST.data.altaInt = ["Alta medicado com "+dose+" até à consulta", "Marcada consulta Medicina Interna - TEV em 3 meses"];
    go("alta_fim","Concluído");
  } else {
    ST.data.regime = dose+", manter até à consulta.";
    go("ac_fim","Plano");
  }
}

SCREENS.ac_contra = { crumb:"Contraindicação", html: () => `
  <p class="kick">TEV · contraindicação à anticoagulação</p>
  <h2><span class="tag t-red">SEM ANTICOAGULAÇÃO</span> O que fazer</h2>
  <div class="verdict v-red"><h3>Abordagem</h3><ul>
    <li>Colocar um <b>filtro da veia cava inferior, removível</b>. Apesar de não tratar o TEP que já está no pulmão, impede que novos trombos das pernas subam e provoquem outro embolismo enquanto o doente não pode ser anticoagulado.</li>
    <li><b>Retomar a anticoagulação e remover o filtro</b> assim que a contraindicação resolver, e a maioria é temporária (uma hemorragia que se controla, um pós-operatório, uma trombocitopenia que recupera).</li>
    <li>Não é uma medida de rotina: justifica-se apenas quando a anticoagulação está efetivamente contraindicada. Colocar um filtro num doente que pode ser anticoagulado não traz benefício e aumenta o risco de TVP do membro, como demonstrou o ensaio PREPIC2 (ESVS 2021: filtro temporário se contraindicação, I C; sem filtro por rotina, III B).</li>
  </ul></div>
  <div class="verdict v-blu"><h3>Quando o colocar (não há janela validada de horas)</h3>
    <p style="margin:0">A prioridade é retomar a anticoagulação, não a colocação do filtro. Se a contraindicação for previsivelmente resolúvel em 24 a 48 horas e o doente tiver tolerado bem o TEP, é frequentemente suficiente internar, assegurar suporte e iniciar a anticoagulação logo que seja seguro, sem necessidade de filtro. A colocação imediata justifica-se quando existe uma TVP proximal volumosa ou um trombo flutuante e a contraindicação à anticoagulação se prevê prolongada.</p>
  </div>
  <div class="verdict v-amb"><h3>Antes de aceitar o rótulo "contraindicação"</h3>
    <p style="margin:0 0 6px">Poucas contraindicações são mesmo <b>absolutas</b>: hemorragia major ativa, hemorragia intracraniana ou espinhal aguda, cirurgia ou procedimento recente com risco hemorrágico muito elevado, traumatismo major recente, trombocitopenia grave (&lt;25 × 10⁹/L) e coagulopatia grave não corrigível. As restantes situações (tumor intracraniano, hemorragia gastrointestinal recente ou recorrente, trombocitopenia moderada de 25 a 50 × 10⁹/L, insuficiência renal ou hepática avançada, dupla antiagregação, história de hemorragia major) são <b>situações de elevado risco hemorrágico</b>: constituem um risco a gerir e a reavaliar, com decisão individual, e não uma proibição definitiva.</p>
    <p style="margin:0"><b>O registo de "contraindicação à anticoagulação" deve ser sempre acompanhado da respetiva fundamentação:</b> qual a contraindicação, se é absoluta ou uma situação de elevado risco hemorrágico, se é reversível, e quando será reavaliada.</p>
  </div>
  ${ciAC()}
  <button class="go" onclick="$('notebody').classList.add('open')">📋 Ver a nota</button>
  <button class="go sec" onclick="restart()">⟳ Novo doente</button>
`};
function falenciaGo(){

}
