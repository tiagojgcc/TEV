<script>
"use strict";
/* ============ estado & motor (v2: snapshots por passo) ============ */
let ST = { trail: [], data: {} };
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function snap(){ return JSON.parse(JSON.stringify(ST.data)); }

function go(id, crumb){
  if (crumb) ST.trail.push({id, crumb, snap: snap()});
  render(id);
}
function render(id){
  const scr = SCREENS[id];
  document.body.classList.toggle('v-home', id==="home");
  $("app").innerHTML = id==="home" ? scr.html() : '<div class="scr">'+scr.html()+'</div>';
  botoesAcima();
  if (scr.after) scr.after();
  drawCrumbs(); drawNote();
  window.scrollTo({top:0});
}
/* os botões de decisão ficam sempre acima dos ⓘ: um bloco de ⓘ seguido de botões passa para baixo deles */
function botoesAcima(){
  const scr = document.querySelector("#app .scr"); if (!scr) return;
  const isInfo = el => el && el.matches("details.info");
  const isBtn = el => el && el.matches("button.go");
  [...scr.children].forEach(el=>{
    if (!isInfo(el) || isInfo(el.previousElementSibling)) return; /* primeiro ⓘ de cada bloco */
    let fim = el; while (isInfo(fim.nextElementSibling)) fim = fim.nextElementSibling;
    const btns = []; let b = fim.nextElementSibling; while (isBtn(b)){ btns.push(b); b = b.nextElementSibling; }
    btns.forEach(x=>scr.insertBefore(x, el));
  });
}
function backTo(i){
  ST.trail = ST.trail.slice(0, i+1);
  ST.data = JSON.parse(JSON.stringify(ST.trail[i].snap)); /* limpa tudo o que veio depois */
  render(ST.trail[i].id);
}
function restart(){
  if (ST.trail.length>1 && !confirm("Começar um novo doente? A nota atual perde-se.")) return;
  ST = { trail: [], data: {} };
  go("home","Início");
}
function jump(id){ closeModals(); go(id, SCREENS[id].crumb||id); }
/* "Anticoagulação para casa" (cabeçalho): a meio de um doente mantém a nota; só começa de novo se não houver percurso */
function altaGo(){
  closeModals();
  if (ST.trail.length<=1) ST.data = {via:'alta'};
  go('alta_int','Para casa');
}
function openModal(id){ $(id).classList.add("open"); }
function closeModals(){ document.querySelectorAll(".modal").forEach(m=>m.classList.remove("open")); }
function drawCrumbs(){
  const c = $("crumbs");
  c.innerHTML = ST.trail.map((t,i)=>
    '<span class="crumb'+(i===ST.trail.length-1?' cur':'')+'" onclick="backTo('+i+')">'+esc(t.crumb)+'</span>').join('');
}
document.addEventListener("click",e=>{ if(e.target.classList&&e.target.classList.contains("modal")) closeModals(); });
window.addEventListener("beforeunload",e=>{ if(ST.trail.length>1){ e.preventDefault(); e.returnValue=""; }});

/* ============ nota clínica (formato v2) ============ */
/* fecha a frase com ponto final quando ainda não tem */
function fim(s){ s=String(s).trim(); return /[.!?]$/.test(s)? s : s+"."; }
/* concordância de número: "1 ponto" / "2 pontos" */
/* números com vírgula decimal (pt-PT): 6,5 e não 6.5 */
function numPt(n){ return String(n).replace(".",","); }
function plural(n, sing, plur){ return numPt(n)+" "+(Math.abs(n)===1? sing : plur); }
/* primeira letra em maiúscula */
function maiusc(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function marchaTEP(d){
  const seg = [];
  if (d.percN!=null) seg.push("PERC "+d.percN+"/8");
  if (d.dd){
    let ddtxt = "D-dímeros "+ddFmt(d.dd.val)+(d.dd.ac? " sob anticoagulação":"")+" (";
    if (d.dd.ac) ddtxt += "limiares não validados; ";
    ddtxt += d.dd.years>=1 ? ("YEARS ≥1, limiar "+(d.dd.ageAdj?"ajustado à idade ":"")+ddFmt(d.dd.thr)) : ("YEARS 0, limiar "+ddFmt(1000));
    ddtxt += ")";
    seg.push(ddtxt);
    if (d.dd.excl){ seg.push("TEP excluído sem imagem"); return seg.join(" > "); }
  }
  const direta = d.probCls==="alta" && !d.dd;
  const pref = direta ? "angio-TC direta" : "angio-TC";
  if (d.altImg){
    /* a angio-TC não foi exequível: o diagnóstico veio da cintigrafia V/Q ou da eco-doppler dos MI */
    const alt = { vq_pos:"cintigrafia V/Q de alta probabilidade: TEP confirmado", eco_pos:"eco-doppler dos MI: TVP proximal, tratada como TEV",
                  neg:"V/Q ou eco-doppler negativa: TEP excluído", inc:"V/Q ou eco-doppler inconclusiva" }[d.altImg];
    seg.push(pref+" não exequível > "+alt);
  }
  else if (d.sspeTvp) seg.push(pref+": achado subsegmentar não confirmado na releitura > eco-doppler dos MI: TVP proximal");
  else if (d.ctpa==="pos" && d.sspe) seg.push(pref+": TEP subsegmentar isolado, confirmado na releitura com o radiologista"+(d.anatFull? " ("+d.anatFull+")":""));
  else if (d.ctpa==="pos") seg.push(pref+": TEP confirmado"+(d.anat? " ("+d.anat+")":""));
  else if (d.ctpa==="neg") seg.push(pref+": TEP excluído");
  else if (d.ctpa==="ci")  seg.push(pref+" não exequível > V/Q ou eco-doppler dos MI");
  return seg.join(" > ");
}
function buildNote(){
  const d = ST.data, L = [];
  const tep = d.via==="tep" || d.tepJoined;
  if (tep){
    /* título */
    if (d.sspeExcl) L.push("# Suspeita de TEP subsegmentar: não confirmada (sem TEV)");
    else if (d.sspeTvp) L.push("# TVP proximal (achado subsegmentar não confirmado)"+(d.falencia? " sob anticoagulação":""));
    else if (d.ctpa==="pos" && d.sspe) L.push("# TEP subsegmentar isolado"+(d.falencia? " sob anticoagulação":""));
    else if (d.ctpa==="pos" && d.confCls){
      const cl=d.confCls.toLowerCase(); const ph=(cl==="baixo"||cl==="alto")? cl+" risco" : (cl==="não-alto risco"? "não-alto risco" : "risco "+cl);
      /* D2 é choque normotensivo: o título lidera pela AHA e a classe ESC vem a seguir */
      if (d.ahaCat && /^D2/.test(d.ahaCat)) L.push("# TEP, AHA/ACC "+d.ahaCat+" (choque normotensivo); ESC: "+ph+(d.falencia? "; sob anticoagulação":""));
      else L.push("# TEP de "+ph+(d.ahaCat? " (AHA/ACC: "+d.ahaCat+")":"")+(d.falencia? " sob anticoagulação":""));
    }
    else if (d.gravida){
      L.push(d.gravRes==="tvp"? "# TVP proximal (Grávida)"
           : d.gravRes==="tep"? "# TEP (Grávida)"
           : d.gravRes==="excl"? "# Suspeita de TEP (Grávida): excluída"
           : "# Suspeita de TEP (Grávida)");
    }
    else if (d.ctpa==="pos") L.push("# TEP");
    else if (d.instavel==="sim") L.push("# Suspeita de TEP");
    else if (d.percN===0 || (d.dd&&d.dd.excl) || d.ctpa==="neg") L.push("# Suspeita de TEP: excluída");
    else L.push("# Suspeita de TEP");
    if (d.instavel==="sim") L.push("- Instabilidade hemodinâmica - contacto imediato com Medicina Interna/UCI");
    if (d.gravida){
      if (d.gravMarch) L.push("- "+fim(maiusc(d.gravMarch)));
      else if (!d.gravConf) L.push("- Grávida > via própria: YEARS adaptado à gravidez + eco-doppler dos MI se sintomas do membro; angio-TC de dose reduzida como imagem torácica de primeira linha; HBPM; discutir com Medicina Interna/Obstetrícia.");
      if (d.gravPlan){ L.push("- Abordagem: "+fim(d.gravPlan)); L.push("- Plano discutido com Obstetrícia."); }
    }
    if (d.probScore!=null) L.push("- Probabilidade clínica ("+(d.probTool==="wells"?"Wells":"Genebra revisto")+"): "+plural(d.probScore,"ponto","pontos")+" - "+d.probCls+".");
    if (d.percN===0) L.push("- PERC 0/8 > TEP excluído sem D-dímeros. Alta com sinais de alarme explicados.");
    else if (!d.sspeExcl) { let m = marchaTEP(d); if (m){ m = m.charAt(0).toUpperCase()+m.slice(1); L.push("- "+m+"."); } }
  }
  if (d.via==="tvp"){
    const gr = !!d.gravidaTvp;
    if (d.eco && d.eco!=="neg") L.push("# "+maiusc(d.ecoTxt)+(gr?" (Grávida)":"")+(d.falencia? " sob anticoagulação":""));
    else if (d.eco==="neg" && d.wtvp>=2) L.push("# Suspeita de TVP: eco negativa"+(gr?" (Grávida)":""));
    else if (d.eco==="neg" || (d.tvpdd&&d.tvpdd.excl)) L.push("# Suspeita de TVP: excluída"+(gr?" (Grávida)":""));
    else L.push("# Suspeita de TVP"+(gr?" (Grávida)":""));
    if (d.wtvp!=null){
      let m = "Wells de TVP "+plural(d.wtvp,"ponto","pontos")+" ("+(d.wtvp>=2?"provável":"improvável")+")";
      if (d.tvpdd) m += " > D-dímeros "+ddFmt(d.tvpdd.val)+" (limiar "+(d.tvpdd.ageAdj?"ajustado à idade ":"")+ddFmt(d.tvpdd.thr)+")"+(d.tvpdd.excl? " > TVP excluída sem imagem":"");
      if (d.eco) m += " > eco-doppler: "+(d.ecoFull||d.ecoTxt);
      L.push("- "+m+".");
    } else if (d.eco) L.push("- Eco-doppler de todo o membro: "+fim(d.ecoFull||d.ecoTxt));
    if (d.ecoNoite) L.push("- Eco indisponível de imediato > TVP provável > anticoagulação empírica iniciada; eco-doppler nas primeiras 24 h.");
    /* na grávida o tratamento é sempre HBPM: a abordagem é a própria dose */
    if (gr && d._hbpmDose) L.push("- Abordagem: "+d._hbpmDose+"; DOAC e AVK contraindicados.");
    else if (d.ecoAbordagem) L.push("- Abordagem: "+fim(d.ecoAbordagem));
  }
  if (tep && d.stratTxt) L.push("- Estratificação: "+d.stratTxt+".");
  if (d.sspePlan && d.local) L.push("- "+fim(d.sspePlan));
  if (tep && d.local) L.push("- Abordagem: "+fim(d.local));
  if (d.sspePlan && !d.local) L.push("- Abordagem: "+fim(d.sspePlan));
  if (d.altImg==="inc") L.push("- Abordagem: a definir com a especialidade competente; anticoagulação empírica se probabilidade clínica alta e baixo risco hemorrágico.");
  if (d.cdtNote) L.push("- "+fim(maiusc(d.cdtNote)));
  if (d.falenciaLinha) L.push("- "+fim(d.falenciaLinha));
  if (d.gravidaTvp) L.push("- Plano discutido com Obstetrícia.");
  else if (d.acCtx) L.push((d.via==="tvp"||d.sspeTvp)? "- Pedido de consulta de Medicina Interna e cirurgia vascular." : "- Pedido de consulta de Medicina Interna - TEV.");
  if (d.regime && !d.gravidaTvp) L.push("- Anticoagulação: "+d.regime);
  if (d.altaInt){
    if (!L.some(l=>l.startsWith("# "))) L.unshift("# Passagem a anticoagulante oral (TEV)");
    d.altaInt.forEach? d.altaInt.forEach(x=>L.push("- "+fim(x))) : L.push("- "+fim(d.altaInt));
  }
  return L.length? L.join("\n") : "Percorra o algoritmo: a nota constrói-se automaticamente.";
}
function drawNote(){
  const t = buildNote();
  $("notetext").textContent = t;
  const n = (t.match(/\n/g)||[]).length+1;
  $("nlines").textContent = t.startsWith("Percorra")? "" : "("+n+" linhas)";
}
function toggleNote(){ $("notebody").classList.toggle("open"); }
function copyNote(btn){
  const t = buildNote();
  const done = ()=>{ const o=btn.textContent; btn.textContent="Copiado ✓"; setTimeout(()=>btn.textContent=o,1500); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done();});
  } else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} document.body.removeChild(ta);
}
/* dose de enoxaparina (1 mg/kg) arredondada aos 5 mg */
function enoxDose(w){ return Math.round(w/5)*5; }
/* linha da nota quando o TEV surge sob anticoagulação (falência); usada nas vias TEP e TVP */
/* linha da nota na falência: o detalhe do estudo fica no ecrã, a nota leva a abordagem e a dose */
function falenciaTxt(dose){ return "TEV diagnosticado sob anticoagulação (falência) > HBPM em dose terapêutica "+dose; }
function info(sum, body, ref){
  return '<details class="info"><summary>'+sum+'</summary><div class="db">'+body+(ref?'<span class="ref">'+ref+'</span>':'')+'</div></details>';
}
/* ⓘ partilhado: como avaliar o risco hemorrágico (mesma janela em todos os ecrãs; só a frase de abertura e a de fecho mudam com o contexto).
   À esquerda, o essencial; à direita, a calculadora do VTE-BLEED (pesos e corte da Tabela suplementar 14 da ESC 2019, os mesmos da TEV Consulta). Não entra na nota. */
const VTEBLEED = [["Neoplasia ativa",1.5],["Homem com hipertensão não controlada",2],["Anemia",1],["História de hemorragia",1.5],["Idade ≥60 anos",1.5],["Disfunção renal (ClCr 30 a 60 mL/min)",1.5]];
function vbCalc(){
  let n=0; VTEBLEED.forEach((v,i)=>{ if($("vb"+i)&&$("vb"+i).checked) n+=v[1]; });
  const o=$("vbout"); if(!o) return;
  o.className="vbres "+(n>=2?"hi":"lo");
  o.innerHTML="<b>"+plural(n,"ponto","pontos")+": risco "+(n>=2?"alto":"baixo")+"</b> (corte ≥2)";
}
function bleedInfo(ctx){
  const open = ctx==="sspe"
    ? "Não existe um score validado para decidir não anticoagular um TEP subsegmentar isolado: a decisão é individual."
    : ctx==="distal"
    ? "Não existe um score validado para decidir não anticoagular uma TVP distal isolada: a decisão é individual."
    : ctx==="emp"
    ? "Não existe um score validado para decidir anticoagular antes da imagem. Como a anticoagulação empírica é curta, pesa sobretudo o risco de hemorragia imediata."
    : "Não existe um score validado para classificar o risco hemorrágico neste contexto: a avaliação é individual.";
  const close = ctx==="hestia"
    ? "<b>Na dúvida, o critério considera-se presente</b> e o doente não é candidato a alta precoce."
    : ctx==="emp"
    ? "<b>Com probabilidade clínica alta e angio-TC adiada, anticoagula-se enquanto se aguarda</b>, salvo contraindicação (ESC 2019, Classe I; AHA/ACC 2026, Classe 2a). Se a angio-TC for imediata, ou na dúvida, aguarda-se o resultado."
    : "<b>Na dúvida, anticoagula-se.</b> Não anticoagular é a exceção, reservada a doentes com risco hemorrágico claramente elevado.";
  return info("Como avaliar o risco hemorrágico",`<div class="bcols">
    <div>
      <p style="margin:0 0 6px">${open}</p>
      <p style="margin:0 0 4px"><b>Pesam a favor de risco elevado:</b></p>
      <ul style="margin:0 0 8px;padding-left:18px;line-height:1.55">
        <li>Hemorragia major recente ou hemorragia intracraniana prévia.</li>
        <li>Trombocitopenia ou coagulopatia.</li>
        <li>Insuficiência renal ou hepática avançada.</li>
        <li>Idade muito avançada com fragilidade ou quedas de repetição.</li>
        <li>Terapêutica antiagregante associada.</li>
      </ul>
      <p style="margin:0">${close}</p>
    </div>
    <div class="bcalc">
      <p style="margin:0 0 4px"><b>VTE-BLEED</b> <span class="mini">(para estruturar, não para decidir)</span></p>
      ${VTEBLEED.map((v,i)=>'<label class="chk sm"><input type="checkbox" id="vb'+i+'" onchange="vbCalc()"><span>'+v[0]+'</span><span class="pt">+'+numPt(v[1])+'</span></label>').join("")}
      <div id="vbout" class="vbres lo"><b>0 pontos: risco baixo</b> (corte ≥2)</div>
      <p class="mini" style="margin:6px 0 0">Prevê a hemorragia major durante a anticoagulação estável, a partir do dia 30. Não foi desenvolvido nem validado para decidir omitir ou adiar a anticoagulação.</p>
    </div>
  </div>`,"ESC 2019 (Tabela suplementar 14); AHA/ACC 2026; CHEST 2021; VTE-BLEED: Klok, Eur Respir J 2016;48:1369");
}
/* Tabela partilhada: situações que mudam a escolha do anticoagulante (modal em ac_pick / alta_int e ⓘ nos ecrãs de decisão) */
const SITU_TABLE = `<table class="itb" style="margin:0"><tr><th>Situação</th><th>Escolha preferencial</th></tr>
    <tr><td>ClCr &lt;30 mL/min</td><td><b>HBPM</b> (dose ajustada) ou <b>HNF</b> → <b>AVK</b></td></tr>
    <tr><td>SAF triplo-positivo</td><td><b>AVK</b></td></tr>
    <tr><td>Gravidez</td><td><b>HBPM</b></td></tr>
    <tr><td>Neoplasia GI/GU luminal ativa</td><td><b>HBPM</b> <i>(apixabano pode ser alternativa em doentes selecionados)</i></td></tr>
    <tr><td>Child-Pugh C</td><td><b>HBPM</b></td></tr>
    <tr><td>Má absorção ou interações farmacológicas importantes</td><td><b>HBPM</b> <i>(ou HNF)</i></td></tr>
  </table>`;
function situInfo(){ return info("Situações que mudam a escolha do anticoagulante", SITU_TABLE); }
document.getElementById("m_situ_body").innerHTML = SITU_TABLE;
/* ⓘ partilhados: contraindicações (mesma janela em todos os ecrãs com decisão de trombolisar / anticoagular) */
const CI_REF="AHA/ACC 2026; ESC 2019; CHEST 2021; CHEST 2012; UpToDate (consultado em 2026)";
function ciTromb(){
  return info("Contraindicações à trombólise",`
    <p style="margin:0 0 4px"><b>Contraindicações absolutas</b></p>
    <ul style="margin:0 0 8px;padding-left:18px;line-height:1.6">
      <li>Hemorragia intracraniana prévia.</li>
      <li>Neoplasia intracraniana ou malformação vascular cerebral conhecida.</li>
      <li>AVC isquémico nos últimos 3 meses.</li>
      <li>Hemorragia ativa ou diátese hemorrágica major.</li>
      <li>Traumatismo craniano ou cirurgia intracraniana recente.</li>
      <li>Suspeita de dissecação aguda da aorta.</li>
    </ul>
    <p style="margin:0 0 4px"><b>Contraindicações relativas</b></p>
    <ul style="margin:0;padding-left:18px;line-height:1.6">
      <li>HTA grave não controlada (TAS &gt;180 mmHg ou TAD &gt;110 mmHg).</li>
      <li>Cirurgia major ou traumatismo recente (&lt;3 semanas).</li>
      <li>Hemorragia gastrointestinal ou outra hemorragia recente.</li>
      <li>Punção vascular não compressível recente.</li>
      <li>Anticoagulação oral com INR &gt;1,7.</li>
      <li>Gravidez ou puerpério recente.</li>
      <li>RCP traumática ou prolongada (&gt;10 minutos).</li>
    </ul>`,CI_REF);
}
function ciAC(){
  return info("Contraindicações à anticoagulação terapêutica",`
    <p style="margin:0 0 4px"><b>Contraindicações absolutas</b></p>
    <ul style="margin:0 0 8px;padding-left:18px;line-height:1.6">
      <li>Hemorragia major ativa.</li>
      <li>Hemorragia intracraniana ou espinhal aguda.</li>
      <li>Cirurgia ou procedimento recente com risco hemorrágico muito elevado.</li>
      <li>Traumatismo major recente.</li>
      <li>Trombocitopenia grave (&lt;25 × 10⁹/L).</li>
      <li>Coagulopatia grave não corrigível.</li>
    </ul>
    <p style="margin:0 0 8px">Na presença de contraindicação absoluta à anticoagulação num doente com TEP ou TVP proximal, deve ponderar-se a colocação de um filtro de veia cava inferior retrievável, se não existir contraindicação.</p>
    <p style="margin:0 0 4px"><b>Situações de elevado risco hemorrágico (decisão individual)</b></p>
    <ul style="margin:0;padding-left:18px;line-height:1.6">
      <li>Tumor intracraniano.</li>
      <li>Hemorragia gastrointestinal recente ou recorrente.</li>
      <li>Trombocitopenia moderada (25–50 × 10⁹/L).</li>
      <li>Insuficiência renal ou hepática avançada.</li>
      <li>Necessidade de terapêutica antiagregante, sobretudo dupla antiagregação.</li>
      <li>História prévia de hemorragia major.</li>
    </ul>`,CI_REF);
}
function chk(id, label, pts){
  return '<label class="chk"><input type="checkbox" id="'+id+'"><span>'+label+'</span>'+(pts!=null?'<span class="pt">'+(pts>0?'+':'')+numPt(pts)+'</span>':'')+'</label>';
}
const SCREENS = {};
</script>
