      <button class="chip" onclick="jump('conf_hestia')"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M9.5 14.5l1.7 1.7 3.3-3.4"/></svg></span>Hestia (alta precoce)</button>

      <button class="chip more" hidden onclick="jump('tvp_eco')"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-15 2 9h6"/></svg></span>TVP: abordagens</button>
      <button class="chip more" hidden onclick="jump('tvp_tvs')"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9.5" width="16" height="5" rx="2.5" transform="rotate(-45 12 12)"/><path d="M10.5 12h3M12 10.5v3"/></svg></span>TVS</button>
      <button class="chip all" id="toolsToggle" onclick="toggleTools()"><span id="ttlbl">Ver todas</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

`};
function toggleTools(){ const more=document.querySelectorAll('.chip.more'); if(!more.length) return; const willOpen=more[0].hidden; more.forEach(c=>c.hidden=!willOpen); const l=$('ttlbl'); if(l) l.textContent=willOpen?'Ver menos':'Ver todas'; const t=$('toolsToggle'); if(t) t.classList.toggle('open',willOpen); }
SCREENS.porta = { crumb:"Suspeita", html: () => `
  <p class="kick">Suspeita</p>
  <h2>Suspeita de quê?</h2>
  <div class="opts">
    <button class="opt" onclick="ST.data.via='tep';go('tep_inst','TEP')"><b>🫁 TEP</b><small>Dispneia, dor pleurítica, síncope, taquicardia sem explicação…</small></button>
    <button class="opt" onclick="ST.data.via='tvp';go('tvp_wells','TVP')"><b>🦵 TVP</b><small>Edema, dor, cordão venoso, membro quente…</small></button>
  </div>
  <div class="inforow">
  ${info("Quando pensar em TEP?","Deve suspeitar-se de TEP perante dispneia de início súbito ou agravamento inexplicado, dor torácica pleurítica, síncope ou pré-síncope, hemoptises, taquicardia ou hipoxemia sem causa evidente, ou uma descompensação de insuficiência cardíaca ou de DPOC que não responde ao tratamento habitual, sobretudo quando qualquer destas manifestações se associa a um fator de risco (cirurgia, imobilização, neoplasia, estrogénios, TEV prévio, viagem longa). <b>Menos de 10% dos doentes avaliados por suspeita têm de facto o diagnóstico</b>: a suspeita deve ser ampla, e a confirmação, rigorosa.","AHA/ACC 2026, secção 3.1")}
  ${info("Quando pensar em TVP?","Deve suspeitar-se de TVP perante edema unilateral (diferença de perímetro superior a 3 cm), dor na barriga da perna ou na coxa, calor e rubor, cordão palpável ou dilatação venosa superficial. Um membro globalmente edemaciado e tenso sugere trombose iliofemoral; um membro azul e frio, com dor intensa, sugere flegmasia, que constitui uma emergência.","")}
  </div>
`};

/* ============ P1 · TEP ============ */
SCREENS.tep_inst = { crumb:"Instável?", html: () => `
  <p class="kick">Suspeita de TEP · passo 1</p>
  <h2>O doente está hemodinamicamente instável?</h2>
  ${info("Definição de instabilidade (ESC, Tabela 4): basta um critério",`
    <table class="itb"><tr><th>Forma</th><th>Critérios</th></tr>
      <tr><td>Paragem cardiorrespiratória</td><td>Necessidade de reanimação</td></tr>
      <tr><td>Choque obstrutivo</td><td>TAS &lt;90 mmHg <b>ou</b> vasopressores, <b>com</b> hipoperfusão de órgão (confusão, pele fria, oligúria, lactato ↑)</td></tr>
      <tr><td>Hipotensão persistente</td><td>TAS &lt;90 mmHg <b>ou</b> queda ≥40 mmHg, durante &gt;15 min, sem outra causa (arritmia, hipovolemia, sepsis)</td></tr>
    </table>`,"ESC 2019, Tabela 4")}
  <div class="opts">
    <button class="opt danger" onclick="ST.data.instavel='sim';go('tep_inst_sim','Instável')"><b>Sim, instável</b></button>
    <button class="opt safe" onclick="ST.data.instavel='nao';go('tep_gravida','Estável')"><b>Não, estável</b></button>
  </div>
`};
SCREENS.tep_inst_sim = { crumb:"Alto risco", html: () => `
  <p class="kick">TEP · doente instável</p>
  <h2><span class="tag t-red">ALTO RISCO</span> Atuar já</h2>
  <div class="verdict v-red"><h3>Primeiro: chamar ajuda diferenciada <span style="font-weight:400;font-size:13px">(intensivista / sala de emergência / centro de reperfusão)</span></h3></div>
  <div class="verdict v-red"><h3>Enquanto chega</h3><ul>
    <li><b>Ecocardiograma à cabeceira</b> (avaliar o ventrículo direito).</li>
    <li><b>Anticoagulação: HNF</b> em bólus 80 U/kg EV e perfusão 18 U/kg/h, ajustar por aPTT (1,5 a 2,5× o controlo) ou anti-Xa (não usar a enoxaparina peri-trombólise).</li>
  </ul>
  <p class="mini" style="margin:6px 0 0">A angio-TC realiza-se apenas quando o doente tolerar o transporte e o exame.</p>
  </div>
  <div class="verdict v-amb"><h3>Reperfusão primária: trombólise sistémica (ESC I B)</h3>
    <table class="itb"><tr><th>Fármaco</th><th>Dose</th></tr>
      <tr><td><b>Alteplase (rtPA)</b><br><span class="mini">preferido</span></td><td>100 mg EV em 2 h. Na paragem cardíaca (PCR) por TEP: 50 mg em bólus em 2 min, seguido de 50 mg em perfusão nas 2 h seguintes.</td></tr>
      <tr><td>Tenecteplase</td><td>Bólus EV único ajustado ao peso: &lt;60 kg 30 mg · 60–69 35 mg · 70–79 40 mg · 80–89 45 mg · ≥90 kg 50 mg.</td></tr>
    </table>
    <p class="mini" style="margin:6px 0 0">Suspender a HNF durante a infusão de alteplase e retomar sem bólus quando o aPTT &lt;2× o controlo. Contraindicação absoluta ou falência da lise: trombectomia por cateter ou embolectomia cirúrgica.</p>
  </div>
  ${ciTromb()}
  ${ciAC()}
  ${info("Não posso anticoagular nem fazer trombólise: O que fazer? (reperfusão e suporte)",`
    <p style="margin:0 0 6px"><b>Reperfusão sem trombolítico.</b> Quando a anticoagulação está contraindicada, a trombólise sistémica também o está. As alternativas são a <b>trombectomia percutânea por aspiração</b> e a <b>embolectomia cirúrgica</b> (a AHA/ACC 2026 considera a cirurgia razoável na categoria E1 e em doentes selecionados da categoria D). No registo FLAME, a trombectomia associou-se a uma mortalidade intra-hospitalar de 1,9%, contra 29,5% no braço de tratamento convencional; trata-se, contudo, de um estudo observacional, com seleção de doentes. Em Portugal, a decisão dos primeiros minutos é a da transferência e do centro de destino: o contacto com o centro de referência deve ser feito precocemente, em paralelo com a estabilização.</p>
    <p style="margin:0 0 6px"><b>Corrigir a contraindicação em paralelo.</b> Transfusão de plaquetas, reversão da varfarina ou do DOAC, endoscopia ou parecer de Neurocirurgia, conforme o caso. Logo que a contraindicação seja ultrapassada, inicia-se HNF em perfusão, sem bólus e com alvo no limite inferior do intervalo terapêutico, por ser de curta duração e reversível com protamina.</p>
    <p style="margin:0"><b>Suporte hemodinâmico e ventilatório.</b> É nesta fase que se decide grande parte do prognóstico. A fluidoterapia deve ser limitada (no máximo 500 mL) e reservada a doentes com pressões de enchimento baixas, porque a sobrecarga de um ventrículo direito já dilatado reduz o débito do ventrículo esquerdo. A noradrenalina é o vasopressor de primeira linha. A entubação deve ser evitada sempre que possível, uma vez que a indução anestésica e a ventilação com pressão positiva podem precipitar a paragem cardíaca; quando inevitável, preferir cetamina ou etomidato, volumes correntes baixos e PEEP mínima, evitando o propofol em dose de indução. A VA-ECMO pode servir de ponte para a trombectomia ou a embolectomia no choque refratário ou na paragem cardíaca.</p>`,"FLAME, Circ Cardiovasc Interv 2023; AHA/ACC 2026; ESC 2019")}
  <button class="go sec" onclick="restart()">⟳ Novo doente</button>
`};
SCREENS.tep_gravida = { crumb:"Grávida?", html: () => `

  <h2>A doente está grávida (ou pós-parto ≤6 semanas)?</h2>
  <div class="opts">
    <button class="opt" onclick="ST.data.gravida=false;go('tep_prob','Probabilidade')"><b>Não</b></button>
    <button class="opt" onclick="ST.data.gravida=true;go('tep_grav_via','Gravidez')"><b>Sim</b></button>

`};
SCREENS.tep_grav_via = { crumb:"Via gravidez", html: () => `
  <p class="kick">Suspeita de TEP · gravidez</p>
  <h2><span class="tag t-amb">VIA PRÓPRIA</span> YEARS adaptado à gravidez</h2>
  <p class="sub">Estratégia validada na gravidez (Artemis): evita imagem em 32–65% das doentes e trata sem imagem torácica quando a eco dos MI é positiva. Discutir sempre com Medicina Interna / Obstetrícia.</p>
  <h2 style="font-size:18px">Tem sintomas ou sinais de TVP (edema ou dor unilateral do membro)?</h2>
  <div class="opts">

    <button class="opt" onclick="ST.data.grav={tvpSx:false};go('grav_years','YEARS')"><b>Não</b><small>Seguir para YEARS + D-dímeros</small></button>
  </div>
`};
SCREENS.grav_eco = { crumb:"Eco MI", html: () => `
  <p class="kick">Gravidez · sintomas de TVP</p>
  <h2>Eco-doppler de compressão dos MI: primeiro exame</h2>
  <p class="sub">Se mostrar TVP proximal, assume-se TEV e trata-se <b>sem nenhuma imagem torácica</b>: zero radiação.</p>
  <div class="opts">
    <button class="opt" onclick="ST.data.grav.eco='pos';gravSetNote('tvp');go('grav_trat','Tratar')"><b>Positiva: TVP</b><small>Tratar como TEV confirmado, sem imagem torácica</small></button>
    <button class="opt" onclick="ST.data.grav.eco='neg';go('grav_years','YEARS')"><b>Negativa</b><small>Continuar: YEARS + D-dímeros</small></button>
  </div>
  <p class="mini">Eco indisponível de imediato? Não atrasa o percurso: seguir para YEARS + D-dímeros e fazer a eco logo que possível.</p>
`};
SCREENS.grav_years = { crumb:"YEARS gravidez", html: () => `
  <p class="kick">Gravidez · YEARS adaptado</p>
  <h2>Critérios YEARS + D-dímeros</h2>
  <p style="font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--mut);margin:8px 0 2px">CRITÉRIOS YEARS <span style="font-weight:400">(seleção obrigatória)</span></p>
  ${chk("gy0","Sinais clínicos de TVP")}
  ${chk("gy1","Hemoptises")}
  ${chk("gy2","TEP é a hipótese mais provável")}
  ${chk("gynone","<b>Nenhum critério presente</b>")}
  <div class="field"><label>D-dímeros ${ddUnitTog("gdval","gravDdCalc")}<span style="font-weight:400;color:var(--mut)">FEU</span></label><input type="text" inputmode="decimal" id="gdval" oninput="gravDdCalc()"></div>
  <div class="verdict" id="gdout" style="display:none"></div>
  <div id="gdbtns"></div>
  ${info("Como funciona o limiar na gravidez",`
    <table class="itb"><tr><th>Critérios YEARS</th><th>Limiar de D-dímeros</th></tr>
      <tr><td>≥1 presente</td><td><b>0,50 mg/L (500 µg/L)</b></td></tr>
      <tr><td>Nenhum</td><td><b>1,00 mg/L (1000 µg/L)</b></td></tr>
    </table>
    <div class="zbar">
      <div class="z-grn">&lt; 0,50<small>excluído<br>para todas</small></div>
      <div class="z-amb">0,50 – 1,00<small>0 critérios → excluído<br>≥1 critério → imagem</small></div>
      <div class="z-red">&gt; 1,00<small>imagem<br>para todas</small></div>
    </div>
    <p class="mini" style="margin:6px 0 0"><b>Sem ajuste à idade</b>: na gravidez os limiares são fixos. Embora os D-dímeros aumentem fisiologicamente, a estratégia foi validada com estes valores no estudo Artemis (NEJM 2019): nenhum TEP foi perdido, ocorreu uma TVP (0,2%), e 32 a 65% das grávidas evitaram a imagem, sobretudo no primeiro trimestre.</p>`,"Artemis, NEJM 2019")}
`, after: ()=>{
  ["gy0","gy1","gy2"].forEach(i=>$(i).addEventListener("change",()=>{ if($(i).checked) $("gynone").checked=false; gravDdCalc(); }));
  $("gynone").addEventListener("change",()=>{ if($("gynone").checked){["gy0","gy1","gy2"].forEach(i=>$(i).checked=false);} gravDdCalc(); });
  const r=ST.data._gyRaw;
  if(r){ ["gy0","gy1","gy2"].forEach((i,ix)=>{ if(r.gy[ix]) $(i).checked=true; }); if(r.none) $("gynone").checked=true; if(r.val!=null&&r.val!=="") $("gdval").value=r.val; }
  else if (ST.data.grav && ST.data.grav.tvpSx && ST.data.grav.eco!=="pos") $("gy0").checked=true;
  gravDdCalc();
}};
function gravDdCalc(){
  const val = ddToUg($("gdval").value);
  const years = ["gy0","gy1","gy2"].filter(i=>$(i).checked).length;
  const none = $("gynone").checked;
  ST.data._gyRaw = {gy:["gy0","gy1","gy2"].map(i=>$(i).checked), none, val:$("gdval").value};
  snapTop("grav_years");
  const o=$("gdout"), b=$("gdbtns");
  if (isNaN(val)){ o.style.display="none"; b.innerHTML=""; return; }
  if (years===0 && !none){ o.style.display="block"; o.className="verdict v-blu"; o.innerHTML="<h3>Complete os critérios YEARS</h3>Marque os presentes (ou <b>«Nenhum critério presente»</b>) para calcular o limiar."; b.innerHTML=""; return; }
  const thr = years>=1? 500 : 1000, excl = val<thr;
  ST.data.grav.years=years; ST.data.grav.dd={val,thr,excl};
  o.style.display="block"; o.className="verdict "+(excl?"v-grn":"v-amb");
  o.innerHTML = "<h3>"+ddFmt(val)+" vs limiar "+ddFmt(thr)+" → "+(excl?"TEP <b>excluído</b> sem imagem":"é precisa <b>imagem</b>")+"</h3><span class='mini'>"+(years>=1?"≥1 critério YEARS → "+ddFmt(500):"0 critérios YEARS → "+ddFmt(1000))+" (fixo na gravidez)</span>";
  b.innerHTML = excl
    ? '<button class="go" onclick="gravSetNote(\'excl\');go(\'grav_excl\',\'Excluído\')">Concluir: excluído</button>'
    : '<button class="go" onclick="go(\'grav_img\',\'Imagem\')">Escolher a imagem →</button>';
}
SCREENS.grav_img = { crumb:"Imagem", html: () => `
  <p class="kick">Gravidez · imagem torácica</p>
  <h2>A radiografia de tórax é normal?</h2>
  <p class="sub">É o Rx que escolhe o exame: a cintigrafia de perfusão irradia menos a mama e rende mais com parênquima normal.</p>
  <div class="opts">
    <button class="opt" onclick="ST.data.grav.imgName='cintigrafia de perfusão (Rx tórax normal)';ST.data.grav.imgShort='Cintigrafia de perfusão';go('grav_imgres','Resultado')"><b>Normal → cintigrafia de perfusão</b><small>Preferida na gravidez; perfusão normal exclui</small></button>

function ddUnit(){ return ST.data._ddUnit || 'mg'; }
function ddToUg(raw){ const v=parseFloat(String(raw==null?'':raw).replace(',','.')); if(isNaN(v)) return NaN; return ddUnit()==='mg'? Math.round(v*1000) : Math.round(v); }
function ddFmt(ug){ if(ug==null||isNaN(ug)) return ""; return ddUnit()==='mg'? (ug/1000).toFixed(2).replace('.',',')+" mg/L" : Math.round(ug)+" µg/L"; }
function ddUnitTog(fieldId, calcName){ const u=ddUnit();
  return '<span class="ddunit" id="'+fieldId+'_u">'+
    '<button type="button" data-v="mg" class="'+(u==='mg'?'on':'')+'" onclick="ddUnitSet(\'mg\',\''+fieldId+'\',\''+calcName+'\')">mg/L</button>'+
    '<button type="button" data-v="ug" class="'+(u==='ug'?'on':'')+'" onclick="ddUnitSet(\'ug\',\''+fieldId+'\',\''+calcName+'\')">µg/L</button>'+
    '</span>'; }
function ddUnitSet(u, fieldId, calcName){ const old=ddUnit(); if(u===old) return;
  const el=$(fieldId);
  if(el && el.value!==''){ const raw=parseFloat(String(el.value).replace(',','.')); if(!isNaN(raw)){ const ug= old==='mg'? raw*1000 : raw; el.value = u==='mg'? String(+(ug/1000).toFixed(2)) : String(Math.round(ug)); } }
  ST.data._ddUnit=u;
  const box=$(fieldId+'_u'); if(box) box.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on', x.dataset.v===u));
  if(window[calcName]) window[calcName]();
}
function fcSel(l){ document.querySelectorAll("#gfc label").forEach(x=>x.classList.remove("on")); l.classList.add("on"); probCalc(); }
function probCalc(){
  const tool = ST.data.probTool || "geneva";
  let s = 0, cls, det;
  if (tool==="geneva"){
    GENEVA.forEach((g,i)=>{ if($("g"+i)&&$("g"+i).checked) s+=g[1]; });
    const fc = document.querySelector("#gfc label.on"); if (fc) s += parseInt(fc.dataset.v);
    cls = s<=3?"baixa":(s<=10?"intermédia":"alta");
    det = s<=3?"0–3 pontos":(s<=10?"4–10 pontos":"≥11 pontos");
  } else {
    WELLS.forEach((w,i)=>{ if($("w"+i)&&$("w"+i).checked) s+=w[1]; });
    cls = s<2?"baixa":(s<=6?"intermédia":"alta");
    det = s<2?"<2 pontos":(s<=6?"2–6 pontos":">6 pontos");
  }
  const _pv = ST.data._probRaw||{};
  if(tool==="geneva"){ const _fcl=document.querySelector("#gfc label.on"); ST.data._probRaw={tool, g:GENEVA.map((x,i)=>!!($("g"+i)&&$("g"+i).checked)), fc:_fcl?_fcl.dataset.v:null, w:_pv.w||null}; }
  else { ST.data._probRaw={tool, w:WELLS.map((x,i)=>!!($("w"+i)&&$("w"+i).checked)), g:_pv.g||null, fc:_pv.fc!=null?_pv.fc:null}; }
  snapTop("tep_prob");
  ST.data._ps = s; ST.data._pc = cls;
  const o = $("probout");
  if (o){ o.style.display="block";
    o.innerHTML = "<h3>"+s+" pontos: probabilidade <b>"+cls+"</b> <span class='mini'>("+det+")</span></h3>"+
      (cls==="baixa"?"Pode aplicar o PERC antes de pedir D-dímeros.":cls==="intermédia"?"Seguir para D-dímeros com limiar ajustado.":"Angio-TC direta: sem D-dímeros.");
  }
}
function probGo(){

}

    </div>
    <p class="mini" style="margin:6px 0 0">Valores em mg/L (equivalente µg/L entre parêntesis; 1 mg/L = 1000 µg/L). O <b>0,55 mg/L</b> do laboratório é o intervalo de referência (o "normal"), <b>não</b> o limiar de decisão. Nenhum limiar desce abaixo de 0,50 mg/L (o ajuste à idade só se aplica a partir dos 50 anos), por isso <b>um valor &lt;0,50 exclui sempre</b>. Na zona intermédia, com pelo menos um critério YEARS, compara-se o valor com 0,50 mg/L (ou com idade×10 µg/L acima dos 50 anos): abaixo do limiar, o TEP fica excluído; acima, pede-se angio-TC. A estratégia está validada (taxa de falha inferior a 2% de TEV aos 3 meses) e reduz o número de angio-TC em comparação com o ajuste à idade isolado.</p>`,"YEARS, Lancet 2017; ensaio europeu cluster-RCT; AHA/ACC 2026, Figura 1")}
`, after: ()=>{ ["y0","y1","y2","yac"].forEach(i=>$(i).addEventListener("change",ddSync));
  $("ynone").addEventListener("change",()=>{ if($("ynone").checked){["y0","y1","y2"].forEach(i=>$(i).checked=false);} ddCalc(); });
  const r=ST.data._ddraw; if(r){ $("ddage").value=r.age??""; $("ddval").value=r.val??""; ["y0","y1","y2"].forEach((i,ix)=>$(i).checked=!!r.y[ix]); $("ynone").checked=!!r.none; $("yac").checked=!!r.ac; }
  ddCalc(); }};
function ddSync(){ if(["y0","y1","y2"].some(i=>$(i).checked)) $("ynone").checked=false; ddCalc(); }
function ddCalc(){
  const age = parseInt($("ddage").value), val = ddToUg($("ddval").value);
  const years = ["y0","y1","y2"].filter(i=>$(i).checked).length;
  const none = $("ynone").checked;
  const ac = $("yac").checked;
  ST.data._ddraw = {age:$("ddage").value, val:$("ddval").value, y:["y0","y1","y2"].map(i=>$(i).checked), none, ac};
  snapTop("tep_dd");
  const o = $("ddout"), b = $("ddbtns");
  if (isNaN(age)||isNaN(val)){ o.style.display="none"; b.innerHTML=""; return; }
  if (years===0 && !none){ o.style.display="block"; o.className="verdict v-blu"; o.innerHTML="<h3>Complete os critérios YEARS</h3>Marque os presentes (ou <b>«Nenhum critério presente»</b>) para calcular o limiar."; b.innerHTML=""; return; }
  const ageAdj = years>=1 && age>50;
  const thr = years>=1 ? Math.min(ageAdj? age*10 : 500, 1000) : 1000;
  const why = years>=1 ? ("≥1 critério YEARS → limiar "+(ageAdj?"ajustado à idade ("+ddFmt(age*10)+")":ddFmt(500))) : ("0 critérios YEARS → limiar "+ddFmt(1000));
  const excl = val < thr;
  ST.data._dd = {val, thr, why, excl, ac, years, ageAdj};
  o.style.display="block";
  o.className = "verdict "+(excl?"v-grn":"v-amb");
  o.innerHTML = "<h3>"+ddFmt(val)+" vs limiar "+ddFmt(thr)+" → "+(excl?"TEP <b>excluído</b> sem imagem":"<b>angio-TC</b> indicada")+"</h3>"+
    "<span class='mini'>"+why+"</span>"+
    (ac? "<div class='warnband' style='margin:10px 0 0'>⚠ Sob anticoagulação os limiares NÃO estão validados: a decisão de imagem deve ser clínica, não pelos D-dímeros.</div>":"");
  b.innerHTML = excl
    ? '<button class="go" onclick="ST.data.dd=ST.data._dd;go(\'tep_excl\',\'Excluído\')">Concluir: excluído</button>'
    : '<button class="go" onclick="ST.data.dd=ST.data._dd;go(\'tep_img\',\'Angio-TC\')">Prosseguir para angio-TC</button>';
}

function sspeTreat(mode){
  ST.data.acCtx='amb';
  delete ST.data.sspeExcl;
  ST.data.sspe = true;
  ST.data.ctpa = "pos";
  ST.data.sspePlan = mode==="tvp"
    ? "Achado subsegmentar não confirmado na releitura, mas eco-doppler dos MI com TVP; anticoagulação em dose de tratamento"
    : mode==="hemo"
    ? "Risco hemorrágico ponderado; decidido anticoagular em dose de tratamento"
    : null;
  go("conf_hestia","Alta precoce?");
}
