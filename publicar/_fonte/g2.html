<script>
"use strict";
/* ============ estado & motor (v2: snapshots por passo) ============ */
let ST = { trail: [], data: {} };
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function snap(){ return JSON.parse(JSON.stringify(ST.data)); }

function go(id, crumb){
  if (crumb) ST.trail.push({id, crumb, snap: snap()});
  render(id);
}
function render(id){
  const scr = SCREENS[id];
  document.body.classList.toggle('v-home', id==="home");
  $("app").innerHTML = id==="home" ? scr.html() : '<div class="scr">'+scr.html()+'</div>';
  if (scr.after) scr.after();
  drawCrumbs(); drawNote();
  window.scrollTo({top:0});
}
function backTo(i){
  ST.trail = ST.trail.slice(0, i+1);
  ST.data = JSON.parse(JSON.stringify(ST.trail[i].snap)); /* limpa tudo o que veio depois */
  render(ST.trail[i].id);
}
function restart(){
  if (ST.trail.length>1 && !confirm("Começar um novo doente? A nota atual perde-se.")) return;
  ST = { trail: [], data: {} };
  go("home","Início");
}
function jump(id){ closeModals(); go(id, SCREENS[id].crumb||id); }
function openModal(id){ $(id).classList.add("open"); }
function closeModals(){ document.querySelectorAll(".modal").forEach(m=>m.classList.remove("open")); }
function drawCrumbs(){
  const c = $("crumbs");
  c.innerHTML = ST.trail.map((t,i)=>
    '<span class="crumb'+(i===ST.trail.length-1?' cur':'')+'" onclick="backTo('+i+')">'+esc(t.crumb)+'</span>').join('');
}
document.addEventListener("click",e=>{ if(e.target.classList&&e.target.classList.contains("modal")) closeModals(); });
window.addEventListener("beforeunload",e=>{ if(ST.trail.length>1){ e.preventDefault(); e.returnValue=""; }});

/* ============ nota clínica (formato v2) ============ */
function marchaTEP(d){
  const seg = [];
  if (d.percN!=null) seg.push("PERC "+d.percN+"/8");
  if (d.dd){
    let ddtxt = "D-dímeros "+ddFmt(d.dd.val)+" (";
    ddtxt += d.dd.years>=1 ? ("YEARS ≥1, limiar "+(d.dd.ageAdj?"ajustado à idade ":"")+ddFmt(d.dd.thr)) : ("YEARS 0, limiar "+ddFmt(1000));
    ddtxt += ")";
    if (d.dd.ac) ddtxt += " [sob anticoagulação: limiares não validados]";
    seg.push(ddtxt);
    if (d.dd.excl){ seg.push("TEP excluído sem imagem"); return seg.join(" > "); }
  }
  const direta = d.probCls==="alta" && !d.dd;
  const pref = direta ? "angio-TC direta" : "angio-TC";
  if (d.ctpa==="pos") seg.push(pref+": TEP confirmado"+(d.anat? " ("+d.anat+")":""));
  else if (d.ctpa==="neg") seg.push(pref+": TEP excluído");
  else if (d.ctpa==="ci")  seg.push(pref+" não exequível > V/Q ou eco-doppler dos MI");
  return seg.join(" > ");
}
function buildNote(){
  const d = ST.data, L = [];
  const tep = d.via==="tep" || d.tepJoined;
  if (tep){
    /* título */
    if (d.sspeExcl) L.push("# Suspeita de TEP subsegmentar: não confirmada (sem TEV)");
    else if (d.ctpa==="pos" && d.sspe) L.push("# TEP subsegmentar isolado");
    else if (d.ctpa==="pos" && d.confCls){ const cl=d.confCls.toLowerCase(); const ph=(cl==="baixo"||cl==="alto")? cl+" risco" : "risco "+cl; L.push("# TEP de "+ph+(d.ahaCat? " (AHA/ACC: "+d.ahaCat+")":"")); }
    else if (d.ctpa==="pos") L.push("# TEP");
    else if (d.instavel==="sim") L.push("# Suspeita de TEP: instável");
    else if (d.gravida){
      L.push(d.gravRes==="tvp"? "# TVP proximal na gravidez"
           : d.gravRes==="tep"? "# TEP na gravidez"
           : d.gravRes==="excl"? "# Suspeita de TEP na gravidez: excluída"
           : "# Suspeita de TEP: gravidez");
    }
    else if (d.percN===0 || (d.dd&&d.dd.excl) || d.ctpa==="neg") L.push("# Suspeita de TEP: excluída");
    else L.push("# Suspeita de TEP");
    if (d.instavel==="sim") L.push("- Instabilidade hemodinâmica > ETT à cabeceira; contacto imediato com Medicina Interna/UCI; anticoagulação parentérica se sem contraindicação.");
    if (d.gravida){
      if (d.gravMarch) L.push("- "+d.gravMarch+".");
      else L.push("- Grávida > via própria: YEARS adaptado à gravidez + eco-doppler se sintomas de TVP; cintigrafia de perfusão preferida se Rx tórax normal; HBPM; discutir com Medicina Interna/Obstetrícia.");
      if (d.gravPlan) L.push("- "+d.gravPlan);
    }
    if (d.probScore!=null) L.push("- Probabilidade clínica ("+(d.probTool==="wells"?"Wells":"Genebra revisto")+"): "+d.probScore+" pontos - "+d.probCls+".");
    if (d.percN===0) L.push("- PERC 0/8 > TEP excluído sem D-dímeros. Alta com sinais de alarme explicados.");
    else if (!d.sspeExcl) { let m = marchaTEP(d); if (m){ m = m.charAt(0).toUpperCase()+m.slice(1); L.push("- "+m+"."); } }
  }
  if (d.via==="tvp"){
    if (d.eco && d.eco!=="neg") L.push(d.tvpConf? "# "+d.ecoTxt.charAt(0).toUpperCase()+d.ecoTxt.slice(1) : "# "+d.ecoTxt.charAt(0).toUpperCase()+d.ecoTxt.slice(1));
    else if (d.eco==="neg" || (d.tvpdd&&d.tvpdd.excl)) L.push("# Suspeita de TVP: excluída");
    else L.push("# Suspeita de TVP");
    if (d.wtvp!=null){
      let m = "Wells de TVP "+d.wtvp+" pontos ("+(d.wtvp>=2?"provável":"improvável")+")";
      if (d.tvpdd) m += " > D-dímeros "+ddFmt(d.tvpdd.val)+" (limiar "+(d.tvpdd.ageAdj?"ajustado à idade ":"")+ddFmt(d.tvpdd.thr)+")"+(d.tvpdd.excl? " > TVP excluída sem imagem":"");
      if (d.eco) m += " > eco-doppler: "+d.ecoTxt;
      L.push("- "+m+".");
    } else if (d.eco) L.push("- Eco-doppler de todo o membro: "+d.ecoTxt+".");
    if (d.ecoNoite) L.push("- Eco indisponível de imediato > TVP provável > anticoagulação empírica iniciada; eco-doppler nas primeiras 24 h.");
    if (d.ecoConduta) L.push("- Abordagem: "+d.ecoConduta);
  }
  if (tep && (d.confCls||d.stratTxt||d.local)){
    if (d.stratTxt) L.push("- Estratificação: "+d.stratTxt+".");
    if (d.local) L.push("- Abordagem: "+d.local+".");
  }
  if (d.sspePlan) L.push((d.local? "- " : "- Abordagem: ")+d.sspePlan+".");
  if (d.cdtNote) L.push("- "+d.cdtNote+".");
  if (d.acCtx) L.push("- Pedido de consulta de Medicina Interna - TEV.");
  if (d.regime) L.push("- Anticoagulação: "+d.regime);
  if (d.altaInt){
    if (d.via==="alta" && !L.length) L.push("# Passagem a anticoagulante oral (TEV)");
    d.altaInt.forEach? d.altaInt.forEach(x=>L.push("- "+x)) : L.push("- "+d.altaInt);
  }
  return L.length? L.join("\n") : "Percorra o algoritmo: a nota constrói-se automaticamente.";
}
function drawNote(){
  const t = buildNote();
  $("notetext").textContent = t;
  const n = (t.match(/\n/g)||[]).length+1;
  $("nlines").textContent = t.startsWith("Percorra")? "" : "("+n+" linhas)";
}
function toggleNote(){ $("notebody").classList.toggle("open"); }
function copyNote(btn){
  const t = buildNote();
  const done = ()=>{ const o=btn.textContent; btn.textContent="Copiado ✓"; setTimeout(()=>btn.textContent=o,1500); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done();});
  } else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} document.body.removeChild(ta);
}
function info(sum, body, ref){
  return '<details class="info"><summary>'+sum+'</summary><div class="db">'+body+(ref?'<span class="ref">'+ref+'</span>':'')+'</div></details>';
}
/* ⓘ partilhado: como avaliar o risco hemorrágico (mesma janela em todos os ecrãs; só a frase de abertura muda com o contexto) */
function bleedInfo(ctx){
  const open = ctx==="sspe"
    ? "Não existe um score validado para decidir não anticoagular um TEP subsegmentar isolado. A decisão é individual e resulta da ponderação entre o risco de recorrência do TEV, o risco de hemorragia e a confiança de que o achado imagiológico corresponde a um verdadeiro TEP."
    : ctx==="distal"
    ? "Não existe um score validado para decidir não anticoagular uma TVP distal isolada. A decisão é individual e resulta da ponderação entre o risco de extensão ou recorrência do TEV e o risco de hemorragia."
    : ctx==="emp"
    ? "Não existe um score validado para decidir anticoagular antes da imagem. A decisão é individual e resulta da ponderação entre a probabilidade clínica de TEP, o risco de hemorragia e o tempo previsto até à angio-TC. A anticoagulação empírica é de curta duração, pelo que o que pesa é o risco de hemorragia imediata."
    : "Não existe um score validado para classificar o risco hemorrágico neste contexto. A avaliação é individual e resulta da ponderação entre o risco de recorrência do TEV e o risco de hemorragia.";
  const tool = ctx==="hestia"
    ? "Ferramentas como o VTE-BLEED podem ajudar a estruturar a avaliação do risco hemorrágico, mas não foram desenvolvidas nem validadas para esta decisão."
    : "Ferramentas como o VTE-BLEED podem ajudar a estruturar a avaliação do risco hemorrágico, mas não foram desenvolvidas nem validadas para decidir omitir anticoagulação.";
  const close = ctx==="hestia"
    ? "Em caso de dúvida, o critério considera-se presente e o doente não é candidato a alta precoce."
    : ctx==="emp"
    ? "Com probabilidade clínica alta e angio-TC adiada, anticoagula-se enquanto se aguarda a imagem, salvo contraindicação (ESC 2019, Classe I; AHA/ACC 2026, Classe 2a). Se a angio-TC for imediata, ou na dúvida quanto ao risco hemorrágico, aguarda-se o resultado."
    : "Na dúvida, anticoagula-se. A exceção deve reservar-se para doentes cuidadosamente selecionados, com risco hemorrágico claramente elevado.";
  return info("Como avaliar o risco hemorrágico",`
    <p style="margin:0 0 6px">${open}</p>
    <p style="margin:0 0 6px">Pesam a favor de risco hemorrágico elevado: hemorragia major recente, hemorragia intracraniana prévia, trombocitopenia ou coagulopatia, insuficiência renal ou hepática avançada, idade muito avançada com fragilidade ou quedas de repetição, e necessidade de terapêutica antiagregante, sobretudo quando associada a outros fatores de risco.</p>
    <p style="margin:0 0 6px">${tool}</p>
    <p style="margin:0">${close}</p>`,"AHA/ACC 2026; ESC 2019; CHEST 2021; VTE-BLEED (Klok, Eur Respir J 2016)");
}
/* Tabela partilhada: situações que mudam a escolha do anticoagulante (modal em ac_pick / alta_int e ⓘ nos ecrãs de decisão) */
const SITU_TABLE = `<table class="itb" style="margin:0"><tr><th>Situação</th><th>Escolha preferencial</th></tr>
    <tr><td>ClCr &lt;30 mL/min</td><td><b>HBPM</b> (dose ajustada) ou <b>HNF</b> → <b>AVK</b></td></tr>
    <tr><td>SAF triplo-positivo</td><td><b>AVK</b></td></tr>
    <tr><td>Gravidez</td><td><b>HBPM</b></td></tr>
    <tr><td>Neoplasia GI/GU luminal ativa</td><td><b>HBPM</b> <i>(apixabano pode ser alternativa em doentes selecionados)</i></td></tr>
    <tr><td>Child-Pugh C</td><td><b>HBPM</b></td></tr>
    <tr><td>Má absorção ou interações farmacológicas importantes</td><td><b>HBPM</b> <i>(ou HNF)</i></td></tr>
  </table>`;
function situInfo(){ return info("Situações que mudam a escolha do anticoagulante", SITU_TABLE); }
document.getElementById("m_situ_body").innerHTML = SITU_TABLE;
/* ⓘ partilhados: contraindicações (mesma janela em todos os ecrãs com decisão de trombolisar / anticoagular) */
const CI_REF="AHA/ACC 2026; ESC 2019; CHEST 2021; CHEST 2012; UpToDate (consultado em 2026)";
function ciTromb(){
  return info("Contraindicações à trombólise",`
    <p style="margin:0 0 4px"><b>Contraindicações absolutas</b></p>
    <ul style="margin:0 0 8px;padding-left:18px;line-height:1.6">
      <li>Hemorragia intracraniana prévia.</li>
      <li>Neoplasia intracraniana ou malformação vascular cerebral conhecida.</li>
      <li>AVC isquémico nos últimos 3 meses.</li>
      <li>Hemorragia ativa ou diátese hemorrágica major.</li>
      <li>Traumatismo craniano ou cirurgia intracraniana recente.</li>
      <li>Suspeita de dissecação aguda da aorta.</li>
    </ul>
    <p style="margin:0 0 4px"><b>Contraindicações relativas</b></p>
    <ul style="margin:0;padding-left:18px;line-height:1.6">
      <li>HTA grave não controlada (TAS &gt;180 mmHg ou TAD &gt;110 mmHg).</li>
      <li>Cirurgia major ou traumatismo recente (&lt;3 semanas).</li>
      <li>Hemorragia gastrointestinal ou outra hemorragia recente.</li>
      <li>Punção vascular não compressível recente.</li>
      <li>Anticoagulação oral com INR &gt;1,7.</li>
      <li>Gravidez ou puerpério recente.</li>
      <li>RCP traumática ou prolongada (&gt;10 minutos).</li>
    </ul>`,CI_REF);
}
function ciAC(){
  return info("Contraindicações à anticoagulação terapêutica",`
    <p style="margin:0 0 4px"><b>Contraindicações absolutas</b></p>
    <ul style="margin:0 0 8px;padding-left:18px;line-height:1.6">
      <li>Hemorragia major ativa.</li>
      <li>Hemorragia intracraniana ou espinhal aguda.</li>
      <li>Cirurgia ou procedimento recente com risco hemorrágico muito elevado.</li>
      <li>Traumatismo major recente.</li>
      <li>Trombocitopenia grave (&lt;25 × 10⁹/L).</li>
      <li>Coagulopatia grave não corrigível.</li>
    </ul>
    <p style="margin:0 0 8px">Na presença de contraindicação absoluta à anticoagulação num doente com TEP ou TVP proximal, deve ponderar-se a colocação de um filtro de veia cava inferior retrievável, se não existir contraindicação.</p>
    <p style="margin:0 0 4px"><b>Situações de elevado risco hemorrágico (decisão individual)</b></p>
    <ul style="margin:0;padding-left:18px;line-height:1.6">
      <li>Tumor intracraniano.</li>
      <li>Hemorragia gastrointestinal recente ou recorrente.</li>
      <li>Trombocitopenia moderada (25–50 × 10⁹/L).</li>
      <li>Insuficiência renal ou hepática avançada.</li>
      <li>Necessidade de terapêutica antiagregante, sobretudo dupla antiagregação.</li>
      <li>História prévia de hemorragia major.</li>
    </ul>`,CI_REF);
}
function chk(id, label, pts){
  return '<label class="chk"><input type="checkbox" id="'+id+'"><span>'+label+'</span>'+(pts!=null?'<span class="pt">'+(pts>0?'+':'')+pts+'</span>':'')+'</label>';
}
const SCREENS = {};
</script>
